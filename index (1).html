<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlashBox">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FlashBox CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FlashBox CRM — styles
   Encre (#1C1A3A) = structure · Flash (#FFC53D) = actions principales
   Rouge / orange = alertes · Couleurs associés = qui fait quoi
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  color-scheme: light;
  --ink: #1C1A3A; --ink-2: #29264F; --ink-3: #38356A; --ink-txt: #C9C8E0; --ink-doux: #8C8AB0;
  --paper: #F4F5F9; --carte: #FFFFFF; --ligne: #E2E4EE; --ligne-2: #CDD1E0;
  --txt: #1C1A3A; --doux: #62667F;
  --flash: #FFC53D; --flash-2: #F2AE00;
  --rouge: #D63B42; --rouge-bg: #FDEBEC; --rouge-ligne: #F4C6C8;
  --orange: #C96A04; --orange-bg: #FFF1DE; --orange-ligne: #F6D3A6;
  --vert: #1A8F59; --vert-bg: #E2F4EA;
  --t-part: #7C3AED; --t-part-bg: #F1EAFE;
  --t-ent: #0369A1;  --t-ent-bg: #E2F0F9;
  --t-asso: #0F766E; --t-asso-bg: #DDF2EE;
  --r-s: 8px; --r-m: 12px; --r-l: 18px;
  --police: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --haut: env(safe-area-inset-top, 0px);
  --bas: env(safe-area-inset-bottom, 0px);
}
html, body { margin: 0; }
body {
  font-family: var(--police); font-size: 15px; line-height: 1.5; color: var(--txt);
  background: var(--paper); -webkit-font-smoothing: antialiased; font-optical-sizing: auto;
  -webkit-tap-highlight-color: transparent;
}
body.bloque { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--flash-2); outline-offset: 2px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pastille { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
.doux { color: var(--doux); }
.txt-court { display: none; }
.bandeau .alerte { background: #fff; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 42px; padding: 0 16px; border-radius: var(--r-m); border: 1px solid var(--ligne-2);
  background: var(--carte); font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--txt);
  transition: background .15s;
}
.btn:hover { background: #EFF0F6; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-flash { background: var(--flash); border-color: var(--flash-2); color: var(--ink); }
.btn-flash:hover { background: #FFB920; }
.btn-rouge { background: var(--rouge); border-color: var(--rouge); color: #fff; }
.btn-rouge:hover { background: #BF2E35; }
.btn-danger { color: var(--rouge); border-color: var(--rouge-ligne); }
.btn-danger:hover { background: var(--rouge-bg); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn-icone { width: 42px; padding: 0; }
.btn-sm.btn-icone { width: 34px; }
.lien { background: none; border: none; padding: 0; color: var(--doux); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* Boutons de contact (le moyen préféré du client est en jaune) */
.contacts { display: flex; gap: 6px; flex-wrap: wrap; }
.ac {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--ligne-2); background: var(--carte);
  display: grid; place-items: center; color: var(--ink); text-decoration: none;
}
.ac:hover { background: #EFF0F6; }
.ac.pref { background: var(--flash); border-color: var(--flash-2); }
.ac .ico { width: 18px; height: 18px; }
.contacts.large .ac { width: auto; height: 40px; padding: 0 14px; display: inline-flex; gap: 8px; font-weight: 600; font-size: 14px; }

/* ---------- Puces (filtres, choix) ---------- */
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce {
  height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--ligne-2); background: var(--carte);
  font-weight: 500; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.puce:hover { border-color: var(--ink-doux); }
.puce .nb { font-size: 12.5px; color: var(--doux); font-weight: 700; }
.puce.on { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: #fff; }
.puce.on .nb { color: rgba(255,255,255,.8); }
.puce .pastille { width: 9px; height: 9px; }
.puce.on .pastille { background: #fff; }

/* ---------- Alertes ---------- */
.alerte { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; line-height: 1.5; white-space: nowrap; }
.alerte::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.alerte.rouge { background: var(--rouge-bg); color: var(--rouge); }
.alerte.orange { background: var(--orange-bg); color: var(--orange); }
.alerte.ok { background: var(--vert-bg); color: var(--vert); }
.alertes { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Types de clients ---------- */
.type-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); color: var(--c); flex: none; }
.type-tag { font-size: 12.5px; font-weight: 600; color: var(--c); background: var(--bg); padding: 1px 9px; border-radius: 999px; white-space: nowrap; }

/* ---------- Structure générale ---------- */
.coque { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.menu {
  background: var(--ink); color: var(--ink-txt); display: flex; flex-direction: column;
  padding: calc(20px + var(--haut)) 14px calc(16px + var(--bas));
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
}
.marque { display: flex; align-items: center; gap: 11px; padding: 2px 8px 24px; color: #fff; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.marque img { width: 36px; height: 36px; border-radius: 10px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--ink-txt); text-decoration: none; font-weight: 500; position: relative; }
.nav a:hover { background: var(--ink-2); color: #fff; }
.nav a.actif { background: var(--ink-3); color: #fff; }
.nav a.actif::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--flash); }
.nav a.actif .ico { color: var(--flash); }
.compteur { margin-left: auto; background: var(--rouge); color: #fff; font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; padding: 0 6px; }
.nav-titre { font-size: 13px; color: var(--ink-doux); padding: 20px 12px 6px; }
.bientot { display: flex; align-items: center; gap: 12px; padding: 7px 12px; color: #77749F; font-size: 14px; }
.bientot .ico { width: 18px; height: 18px; }
.bientot small { margin-left: auto; font-size: 11.5px; border: 1px solid #45426F; border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.moi { margin-top: auto; border-top: 1px solid var(--ink-2); padding: 14px 6px 0; display: flex; align-items: center; gap: 10px; }
.moi .qui { min-width: 0; flex: 1; }
.moi strong { color: #fff; display: block; font-weight: 700; }
.moi span { font-size: 12.5px; color: var(--ink-doux); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.moi button, .barre-mobile button { background: none; border: 1px solid var(--ink-3); color: var(--ink-txt); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.moi button:hover { background: var(--ink-2); color: #fff; }
.zone { min-width: 0; }
.principal { padding: 32px 36px 64px; }
.contenu { max-width: 1160px; margin: 0 auto; }
.barre-mobile, .onglets { display: none; }

.bandeau-demo { display: flex; gap: 10px; align-items: center; background: #FFF6DA; border: 1px solid #F5DC8E; color: #5C4600; border-radius: var(--r-m); padding: 10px 14px; margin-bottom: 22px; font-size: 14px; }
.bandeau-demo .ico { color: #B88400; }
.hors-ligne { background: var(--rouge); color: #fff; text-align: center; font-weight: 600; font-size: 14px; padding: 6px 12px; padding-top: calc(6px + var(--haut)); }

/* ---------- En-têtes de page ---------- */
.tete-page { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
h1 { font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; }
.sous-titre { color: var(--doux); margin: 6px 0 0; }

/* ---------- Panneaux ---------- */
.panneau { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--r-l); overflow: hidden; }
.panneau-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--ligne); }
.panneau-tete h2 { font-size: 18px; font-weight: 700; }
.vide { padding: 36px 20px; text-align: center; color: var(--doux); }
.vide strong { display: block; color: var(--txt); font-size: 17px; margin-bottom: 4px; }
.vide .btn { margin-top: 14px; }

/* ---------- Tableau de bord ---------- */
.salut h1 { font-size: 42px; }
.salut .phrase { font-size: 19px; margin: 10px 0 0; font-weight: 500; }
.compteurs { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 14px; margin: 26px 0 28px; }
.tuile { border-radius: var(--r-l); padding: 18px 20px; border: 1px solid var(--ligne); background: var(--carte); text-align: left; display: flex; flex-direction: column; gap: 3px; }
.tuile:hover { border-color: var(--ligne-2); }
.tuile .n { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; margin-bottom: 6px; }
.tuile .l { font-weight: 700; font-size: 16px; }
.tuile .d { font-size: 13.5px; color: var(--doux); }
.tuile.rouge { background: var(--rouge-bg); border-color: var(--rouge-ligne); }
.tuile.rouge .n { color: var(--rouge); }
.tuile.orange { background: var(--orange-bg); border-color: var(--orange-ligne); }
.tuile.orange .n { color: var(--orange); }
.tuile.zero .n { color: var(--vert); }
.barre-types { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--ligne); margin: 10px 0 10px; }
.barre-types span { background: var(--c); }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--doux); }
.legende b { color: var(--txt); }
.deux-colonnes { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.a-completer .rang { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 20px; border-bottom: 1px solid var(--ligne); }
.a-completer .rang:last-child { border-bottom: none; }
.rang .nom { font-weight: 650; }
.rang .alertes { margin-top: 5px; }

/* ---------- Liste clients ---------- */
.outils { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.recherche { flex: 1; min-width: 220px; position: relative; }
.recherche .ico { position: absolute; left: 13px; top: 12px; color: var(--doux); }
.recherche input, .select { width: 100%; height: 44px; border: 1px solid var(--ligne-2); border-radius: var(--r-m); background: var(--carte); padding: 0 14px 0 42px; font-size: 16px; }
.select { width: auto; padding: 0 12px; }
.filtres { margin-bottom: 16px; }
.liste .ligne {
  display: grid; grid-template-columns: 40px minmax(0, 2.1fr) minmax(0, 1.6fr) minmax(0, 1.1fr) minmax(0, 1.5fr) 162px;
  gap: 16px; align-items: center; padding: 13px 20px; border-bottom: 1px solid var(--ligne); cursor: pointer;
}
.liste .ligne:last-child { border-bottom: none; }
.liste .ligne:hover { background: #FAFAFD; }
.liste .entete { cursor: default; padding-top: 10px; padding-bottom: 10px; font-size: 13px; color: var(--doux); font-weight: 600; background: #FAFAFD; }
.liste .entete:hover { background: #FAFAFD; }
.nom { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec { font-size: 13.5px; color: var(--doux); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nom-ligne { display: flex; align-items: center; gap: 8px; min-width: 0; }
.liste .col-actions { justify-content: flex-end; flex-wrap: nowrap; }

/* ---------- Tiroir fiche client ---------- */
.voile { position: fixed; inset: 0; background: rgba(28, 26, 58, .45); z-index: 40; animation: fondu .18s ease-out; }
.tiroir {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--paper); z-index: 41;
  display: flex; flex-direction: column; box-shadow: -16px 0 48px rgba(28, 26, 58, .22);
  animation: glisse .24s cubic-bezier(.2, .8, .2, 1);
}
@keyframes fondu { from { opacity: 0; } }
@keyframes glisse { from { transform: translateX(40px); opacity: .4; } }
.tiroir-tete { background: var(--carte); padding: calc(18px + var(--haut)) 20px 16px 22px; border-bottom: 1px solid var(--ligne); display: flex; gap: 14px; align-items: flex-start; }
.tiroir-titres { flex: 1; min-width: 0; }
.tiroir-sur { font-size: 13px; color: var(--doux); font-weight: 600; }
.tiroir-tete h2 { font-size: 24px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.tiroir-meta { font-size: 13px; color: var(--doux); margin-top: 3px; }
.tiroir-corps { flex: 1; overflow-y: auto; padding: 18px 20px 30px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.tiroir-pied { background: var(--carte); border-top: 1px solid var(--ligne); padding: 12px 20px calc(12px + var(--bas)); display: flex; gap: 10px; align-items: center; }
.tiroir-pied .espace { flex: 1; }
.bandeau { border-radius: var(--r-m); padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.bandeau .ico { margin-top: 1px; }
.bandeau.rouge { background: var(--rouge-bg); color: #8E1E24; }
.bandeau.rouge .ico { color: var(--rouge); }
.bandeau.orange { background: var(--orange-bg); color: #7A4000; }
.bandeau.orange .ico { color: var(--orange); }
.bandeau.ok { background: var(--vert-bg); color: #0E5C38; }
.bandeau.ok .ico { color: var(--vert); }
.bandeau strong { display: block; margin-bottom: 4px; }
.bloc { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--r-l); padding: 16px 18px; margin-bottom: 14px; }
.bloc h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 12px; }
.bloc.manque-rouge { border-color: var(--rouge); }
.bloc.manque-orange { border-color: var(--orange-ligne); }
.grille { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.grille .large { grid-column: 1 / -1; }
.champ label, .etiquette { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 5px; color: #3A385A; }
.champ input, .champ textarea, .champ select {
  width: 100%; height: 44px; border: 1px solid var(--ligne-2); border-radius: var(--r-m); padding: 0 12px;
  background: #fff; font-size: 16px; transition: border-color .15s, background .15s;
}
.champ input:focus, .champ textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px rgba(255, 197, 61, .55); }
.champ textarea { height: auto; min-height: 104px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
.champ.manque-rouge input { border-color: var(--rouge); background: #FFF8F8; }
.champ.manque-orange input { border-color: #EDB26E; background: #FFFBF4; }
.indice { font-size: 12.5px; margin-top: 4px; font-weight: 600; min-height: 0; }
.indice:empty { display: none; }
.manque-rouge .indice { color: var(--rouge); }
.manque-orange .indice { color: var(--orange); }
.sous-bloc { margin-top: 14px; }
.choix-type { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.choix-type button { border: 2px solid var(--ligne); background: #fff; border-radius: var(--r-m); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; font-size: 14.5px; }
.choix-type button:hover { border-color: var(--ligne-2); }
.choix-type button.on { border-color: var(--c); background: var(--bg); color: var(--c); }
.choix-type .ico { width: 24px; height: 24px; }

/* ---------- Modales & notifications ---------- */
.modale-fond { position: fixed; inset: 0; background: rgba(28, 26, 58, .5); z-index: 60; display: grid; place-items: center; padding: 20px; animation: fondu .15s; }
.modale { background: #fff; border-radius: var(--r-l); max-width: 440px; width: 100%; padding: 24px; box-shadow: 0 24px 64px rgba(28, 26, 58, .3); }
.modale h2 { font-size: 21px; font-weight: 800; margin-bottom: 8px; }
.modale p { margin: 0 0 18px; color: var(--doux); }
.modale-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.modale .champ { margin-bottom: 12px; }
.choix-associes { display: grid; gap: 10px; margin-bottom: 8px; }
.choix-associes button { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 2px solid var(--ligne); border-radius: var(--r-m); background: #fff; font-weight: 700; font-size: 17px; text-align: left; }
.choix-associes button:hover { border-color: var(--c); background: #FAFAFD; }
.choix-associes .pastille { width: 16px; height: 16px; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + var(--bas)); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; font-weight: 600; display: flex; gap: 9px; align-items: center; box-shadow: 0 10px 30px rgba(28, 26, 58, .3); animation: monte .22s ease-out; }
.toast .ico { color: var(--flash); }
.toast.erreur { background: var(--rouge); }
.toast.erreur .ico { color: #fff; }
@keyframes monte { from { transform: translateY(12px); opacity: 0; } }

/* ---------- Connexion ---------- */
.connexion { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 1.1fr 1fr; }
.connexion-marque { background: var(--ink); color: #fff; padding: calc(48px + var(--haut)) 56px 48px; display: flex; flex-direction: column; justify-content: center; }
.connexion-logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 26px; }
.connexion-nom { font-size: clamp(56px, 8vw, 104px); font-weight: 800; letter-spacing: -0.055em; line-height: .9; margin: 0; }
.connexion-nom span { color: var(--flash); }
.connexion-accroche { font-size: 19px; color: var(--ink-txt); max-width: 30ch; margin: 22px 0 0; }
.connexion-zone { display: grid; place-items: center; padding: 40px 28px calc(40px + var(--bas)); }
.connexion-form { width: 100%; max-width: 380px; }
.connexion-form h1 { font-size: 30px; margin-bottom: 6px; }
.connexion-form > p { color: var(--doux); margin: 0 0 22px; }
.connexion-form .champ { margin-bottom: 14px; }
.connexion-form .btn-flash { width: 100%; height: 48px; font-size: 16px; margin-top: 6px; }
.connexion-form .lien { display: block; margin: 16px auto 0; }
.erreur-form { background: var(--rouge-bg); color: #8E1E24; border-radius: var(--r-m); padding: 10px 12px; font-size: 14px; margin-bottom: 14px; font-weight: 600; }
.note-demo { font-size: 13.5px; color: var(--doux); margin-top: 18px; background: #FFF6DA; border-radius: var(--r-m); padding: 10px 12px; }

/* ---------- Journal ---------- */
.jour { margin-bottom: 18px; }
.jour > h3 { font-size: 14.5px; color: var(--doux); font-weight: 700; margin: 0 0 8px 4px; }
.evt { display: grid; grid-template-columns: 48px 30px minmax(0, 1fr); gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--ligne); align-items: start; }
.evt:last-child { border-bottom: none; }
.evt .h { font-variant-numeric: tabular-nums; color: var(--doux); font-size: 14px; padding-top: 3px; }

/* ---------- Formats ---------- */
const chiffres = (t) => String(t || '').replace(/\D/g, '');
function normTel(t) {
  if (!v(t)) return '';
  const brut = String(t).trim();
  if (brut.startsWith('+')) return '+' + chiffres(brut);
  if (brut.startsWith('00')) return '+' + chiffres(brut).slice(2);
  return chiffres(brut);
}
function telValide(t) {
  const n = normTel(t);
  return /^0[1-9]\d{8}$/.test(n) || /^\+\d{8,15}$/.test(n);
}
function formatTel(t) {
  const n = normTel(t);
  if (/^0\d{9}$/.test(n)) return n.replace(/(\d{2})(?=\d)/g, '$1 ').trim();
  if (/^\+33\d{9}$/.test(n)) return ('0' + n.slice(3)).replace(/(\d{2})(?=\d)/g, '$1 ').trim();
  return String(t).trim();
}
function telWhatsApp(t) {
  const n = normTel(t);
  if (/^0\d{9}$/.test(n)) return '33' + n.slice(1);
  return n.replace('+', '');
}
const mailValide = (m) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(m || '').trim());
function sirenValide(s) {
  const n = chiffres(s);
  if (!/^\d{9}$/.test(n)) return false;
  let total = 0;
  for (let i = 0; i < 9; i++) {
    let d = Number(n[8 - i]);
    if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
    total += d;
  }
  return total % 10 === 0;
}
const formatSiren = (s) => chiffres(s).replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');

/* ---------- Dates ---------- */
const debutJour = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const heure = (d) => new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' }).format(new Date(d)).replace(':', 'h');
function libelleJour(d) {
  const ecart = Math.round((debutJour(new Date()) - debutJour(d)) / 864e5);
  if (ecart === 0) return 'Aujourd’hui';
  if (ecart === 1) return 'Hier';
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  if (new Date(d).getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return cap(new Intl.DateTimeFormat('fr-FR', opts).format(new Date(d)));
}
function quand(d) {
  if (!d) return '';
  const ecart = Math.round((debutJour(new Date()) - debutJour(d)) / 864e5);
  if (ecart === 0) return `aujourd’hui à ${heure(d)}`;
  if (ecart === 1) return `hier à ${heure(d)}`;
  return 'le ' + new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', year: ecart > 300 ? 'numeric' : undefined }).format(new Date(d));
}

function messageErreur(err) {
  const m = (err && (err.message || err.error_description)) || String(err || 'Erreur inconnue');
  const code = err && err.code;
  if (code === '23514' && /prestation_identifiee/.test(m)) return 'Il faut un client ou un intitulé pour la prestation.';
  if (code === '23514' && /indispo_valide/.test(m)) return 'Les dates de l’indisponibilité sont incohérentes.';
  if (code === '23514') return 'Il faut au moins un nom ou un nom de société.';
  if (code === '23505' && /prestations_devis_id/.test(m)) return 'Une prestation existe déjà pour ce devis.';
  if (code === '23505') return 'Ce mail est déjà attribué à un autre associé.';
  if (code === '23503') return 'Ce client a des devis, des prestations ou des factures : impossible de le supprimer.';
  if (code === '42P01' || code === 'PGRST205' || /schema cache|does not exist/i.test(m)) return 'La base n’est pas encore installée : lance les scripts SQL (lots 1 à 4) dans Supabase.';
  if (/Invalid login credentials/i.test(m)) return 'Mail ou mot de passe incorrect.';
  if (/Email not confirmed/i.test(m)) return 'Ce compte n’est pas encore confirmé dans Supabase.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Connexion impossible : vérifie ton réseau.';
  if (/JWT|expired|session/i.test(m)) return 'Session expirée : reconnecte-toi.';
  if (/Password should be/i.test(m)) return 'Mot de passe trop court : 8 caractères minimum.';
  if (/rate limit|security purposes/i.test(m)) return 'Trop de demandes d’affilée : réessaie dans quelques minutes.';
  return m;
}

   ===================================================================== */
async function chargerDonnees() {
  const d = await DB.charger();
  S.associes = d.associes || [];
  S.clients = d.clients || [];
  S.params = d.parametres || {};
  S.journal = d.journal || [];
  S.devis = d.devis || [];
  S.modeles = d.modeles || [];
  S.prestations = d.prestations || [];
  S.indispos = d.indispos || [];
  S.factures = d.factures || [];
  S.paiements = d.paiements || [];
  S.materiel = d.materiel || [];
  S.consommables = d.consommables || [];
  S.mouvements = d.mouvements || [];
  S.depenses = d.depenses || [];
  S.commandes = d.commandes || [];
  S.repartitions = d.repartitions || [];
  S.fondsMouvements = d.fondsMouvements || [];
  S.moi = S.associes.find((a) => v(a.email) && a.email.toLowerCase() === S.user.email) || null;
  stockage.ecrire('flashbox_nom', nomEntreprise());
  calculerAlertes();
  calculerPlanning();
  initBrouillon();
}

async function recharger() {
  try { await chargerDonnees(); }
  catch (err) { toast(messageErreur(err), 'erreur'); return; }
  majCoque();
  if (S.dv && S.dv.id && !devisModifie()) ouvrirEditeurDevis(S.dv.id); // devis ouvert : on reprend la dernière version
  if (S.pr && S.pr.id && !prestationModifiee()) ouvrirEditeurPrestation(S.pr.id);
  if (S.fa && !factureModifiee()) ouvrirEditeurFacture(S.fa.id);
  const actif = document.activeElement;
  const enSaisie = actif && $('#vue')?.contains(actif) && /INPUT|TEXTAREA|SELECT/.test(actif.tagName);
  if (enSaisie) {
    S.renduDiffere = true;
    if (S.view === 'clients') renderListeClients();
  } else {
    renderVue();
  }
}

function abonnerTempsReel() {
  if (MODE !== 'supabase' || S.canal) return;
  S.canal = sb.channel('crm-changements')
    .on('postgres_changes', { event: '*', schema: 'public' }, () => {
      clearTimeout(S.minuteur);
      S.minuteur = setTimeout(recharger, 450);
    })
    .subscribe();
}

/* =====================================================================
   Notifications et modales
   ===================================================================== */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'erreur' ? ' erreur' : '');
  el.innerHTML = ico(type === 'erreur' ? 'alerte' : 'check') + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), type === 'erreur' ? 5200 : 2800);
}
function ouvrirModale(html, fermable = true) {
  $('#modale').innerHTML = `<div class="modale-fond" data-fermable="${fermable ? 1 : 0}"><div class="modale" role="dialog" aria-modal="true">${html}</div></div>`;
  setTimeout(() => $('#modale input, #modale [data-r="1"], #modale button')?.focus(), 30);
}
function fermerModale(valeur) {
  $('#modale').innerHTML = '';
  if (S.resoudreModale) { const r = S.resoudreModale; S.resoudreModale = null; r(valeur); }
}
function confirmer({ titre, texte, ok = 'Confirmer', danger = false }) {
  return new Promise((res) => {
    ouvrirModale(`<h2>${esc(titre)}</h2><p>${esc(texte)}</p>
      <div class="modale-actions"><button class="btn" data-r="0">Annuler</button>
      <button class="btn ${danger ? 'btn-rouge' : 'btn-flash'}" data-r="1">${esc(ok)}</button></div>`);
    S.resoudreModale = res;
  });
}

async function seConnecter(e) {
  e.preventDefault();
  const email = $('#c-mail').value.trim().toLowerCase();
  const mdp = $('#c-mdp').value;
  if (!email || !mdp) { renderConnexion('Renseigne ton mail et ton mot de passe.'); return; }
  const btn = $('#form-connexion button[type=submit]');
  btn.disabled = true; btn.textContent = 'Connexion…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: mdp });
  if (error) { renderConnexion(messageErreur(error)); $('#c-mail').value = email; return; }
  await apresConnexion(data.user.email);
}

async function motDePasseOublie() {
  const email = $('#c-mail')?.value.trim();
  if (!email) { toast('Saisis d’abord ton mail, puis clique sur « Mot de passe oublié ».', 'erreur'); $('#c-mail')?.focus(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) { toast(messageErreur(error), 'erreur'); return; }
  toast('Si ce mail a un compte, un lien de réinitialisation vient d’être envoyé.');
}

function demanderNouveauMdp() {
  ouvrirModale(`
    <h2>Nouveau mot de passe</h2>
    <p>Choisis ton nouveau mot de passe (8 caractères minimum).</p>
    <div class="champ"><label for="n-mdp">Nouveau mot de passe</label><input id="n-mdp" type="password" autocomplete="new-password"></div>
    <div class="modale-actions"><button class="btn btn-flash" data-action="valider-nouveau-mdp">Enregistrer</button></div>`, false);
}

async function apresConnexion(email) {
  S.user = { email: String(email).toLowerCase() };
  if (MODE === 'demo') stockage.ecrire('flashbox_demo_session', S.user.email);
  $('#app').innerHTML = '<div class="vide" style="padding-top:30vh">Chargement…</div>';
  try { await chargerDonnees(); }
  catch (err) {
    $('#app').innerHTML = `<div class="connexion-zone" style="min-height:100vh"><div class="connexion-form"><h1>Oups</h1><div class="erreur-form">${esc(messageErreur(err))}</div><button class="btn" data-action="deconnexion">${ico('sortie')} Se déconnecter</button></div></div>`;
    return;
  }
  const { vue, fiche, p } = lireHash();
  S.view = vue;
  if (EDITEURS[vue] && p.id) EDITEURS[vue].ouvrir(p.id, p);
  renderCoque();
  if (fiche) { S.ficheParNous = false; afficherFiche(fiche); }
  if (!S.moi) demanderIdentite();
  abonnerTempsReel();
}

function demanderIdentite() {
  const libres = S.associes.filter((a) => !v(a.email));
  if (libres.length) {
    ouvrirModale(`
      <h2>Première connexion</h2>
      <p>Qui es-tu ? Ton compte (${esc(S.user.email)}) sera relié à ta fiche associé.</p>
      <div class="choix-associes">${libres.map((a) => `<button data-action="lier-associe" data-id="${esc(a.id)}" style="--c:${esc(a.couleur)}"><span class="pastille"></span>${esc(a.prenom)}</button>`).join('')}</div>`, false);
  } else {
    ouvrirModale(`
      <h2>Première connexion</h2>
      <p>Ton compte n’est relié à aucun associé. Indique ton prénom pour créer ta fiche.</p>
      <div class="champ"><label for="id-prenom">Prénom</label><input id="id-prenom" type="text" autocomplete="given-name"></div>
      <div class="modale-actions"><button class="btn btn-flash" data-action="creer-ma-fiche">Créer ma fiche</button></div>`, false);
  }
}

async function seDeconnecter() {
  if (MODE === 'supabase') { if (S.canal) { sb.removeChannel(S.canal); S.canal = null; } await sb.auth.signOut(); }
  else stockage.effacer('flashbox_demo_session');

/* ---------- Navigation par adresse (#devis?id=...&fiche=...) ---------- */
function lireHash() {
  const [vue, q = ''] = location.hash.slice(1).split('?');
  const p = Object.fromEntries(new URLSearchParams(q));
  return { vue: MODULES.some((m) => m.id === vue) ? vue : 'accueil', fiche: p.fiche || null, p };
}
function construireHash(vue, p = {}) {
  const q = new URLSearchParams(Object.entries(p).filter(([, x]) => x != null && x !== '')).toString();
  return '#' + vue + (q ? '?' + q : '');
}
const sansFiche = (p) => { const r = { ...p }; delete r.fiche; return r; };

async function surHash() {
  if (!S.user) return;
  const { vue, fiche, p } = lireHash();
  const ed = EDITEURS[vue], edCourant = EDITEURS[S.view];
  const idCible = ed ? (p.id || null) : null;
  const idCourant = edCourant ? edCourant.id() : null;
  if (vue !== S.view || idCible !== idCourant) {
    // On quitte un devis ou une prestation en cours de modification ?
    if (edCourant && edCourant.actif() && !S.edSortieOk && edCourant.modifie()) {
      const ok = await confirmer({ titre: 'Quitter sans enregistrer ?', texte: edCourant.texte, ok: 'Quitter', danger: true });
      if (!ok) { history.pushState(null, '', construireHash(S.view, { id: idCourant })); return; }
    }
    S.edSortieOk = false;
    if (edCourant) edCourant.fermer();
    S.view = vue;
    if (idCible) ed.ouvrir(idCible, p);
    renderVue();
    window.scrollTo(0, 0);
  }
  if (fiche) {
    if (!S.fiche || (S.fiche.id || 'nouveau') !== fiche) afficherFiche(fiche);
  } else if (S.fiche) {
    if (!S.sortieOk && ficheModifiee()) {
      const ok = await confirmer({ titre: 'Quitter sans enregistrer ?', texte: 'Les modifications de cette fiche seront perdues.', ok: 'Quitter', danger: true });
      if (!ok) { history.pushState(null, '', construireHash(S.view, { ...p, fiche: S.fiche.id || 'nouveau' })); return; }
    }
    cacherFiche();
  }
}

              <div class="alertes">${al.slice(0, 3).map((a) => `<span class="alerte ${a.niveau}">${esc(a.court)}</span>`).join('')}${al.length > 3 ? `<span class="alerte orange">+${al.length - 3}</span>` : ''}</div></div>
            <button class="btn btn-sm btn-completer" data-action="ouvrir-fiche" data-id="${esc(c.id)}" aria-label="Compléter la fiche">${ico('crayon')}<span class="txt-long">Compléter</span></button>
          </div>`;
        }).join('') + (liste.length > 8 ? `<div class="rang" style="display:block;text-align:center"><button class="lien" data-action="aller-clients" data-filtre="alertes">Voir les ${liste.length} fiches</button></div>` : '')
        : `<div class="vide"><strong>Rien à compléter</strong>Toutes les fiches ont les infos demandées dans les paramètres.</div>`}
      </section>
      </div>

      <section class="panneau">
        <div class="panneau-tete"><h2>Dernières actions</h2><a class="lien" href="#journal">Tout le journal</a></div>
        ${S.journal.length ? S.journal.slice(0, 7).map(evtMini).join('') : '<div class="vide">Aucune action pour l’instant.</div>'}
      </section>
    </div>`;
}

function evtMini(j) {
  const a = associeDe(j.auteur);
  return `<div class="evt-mini">
    <span class="picto ${pictoAction(j.action)}" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center">${ico(iconeAction(j.action))}</span>
    <div><span style="font-weight:700;color:${esc(a.couleur)}">${esc(a.prenom)}</span> ${esc(phraseJournal(j))}
    <div class="quand">${esc(cap(quand(j.date_action)))}</div></div></div>`;
}

/* =====================================================================
   Clients
   ===================================================================== */
const FILTRES = [
  { id: 'tous', libelle: 'Tous' },
  { id: 'particulier', libelle: 'Particuliers', c: 'var(--t-part)' },
  { id: 'entreprise', libelle: 'Entreprises', c: 'var(--t-ent)' },
  { id: 'association', libelle: 'Associations', c: 'var(--t-asso)' },
  { id: 'rouge', libelle: 'Bloquantes', c: 'var(--rouge)' },
  { id: 'orange', libelle: 'À compléter', c: 'var(--orange)' },
];
function passeFiltre(c, f) {
  if (f === 'tous') return true;
  if (TYPES[f]) return c.type === f;
  if (f === 'rouge') return niveauClient(c.id) === 'rouge';
  if (f === 'orange') return niveauClient(c.id) === 'orange';
  if (f === 'alertes') return niveauClient(c.id) !== 'ok';
  return true;
}

function renderClients() {
  return `
    <div class="tete-page">
      <div><h1>Clients</h1><p class="sous-titre" id="compte-clients"></p></div>
      <button class="btn btn-flash" data-action="nouveau-client">${ico('plus')} Nouveau client</button>
    </div>
    <div class="outils">
      <label class="recherche">${ico('recherche')}<input id="recherche-clients" type="search" placeholder="Rechercher un nom, une ville, un numéro…" value="${esc(S.recherche)}" aria-label="Rechercher un client"></label>
      <select class="select" id="tri-clients" aria-label="Trier">
        <option value="nom" ${S.tri === 'nom' ? 'selected' : ''}>Trier par nom</option>
        <option value="recent" ${S.tri === 'recent' ? 'selected' : ''}>Plus récents d’abord</option>
        <option value="alertes" ${S.tri === 'alertes' ? 'selected' : ''}>Alertes d’abord</option>
      </select>
    </div>
    <div class="puces filtres" id="filtres-clients"></div>
    <section class="panneau liste" id="liste-clients"></section>`;
}

function renderListeClients() {
  const q = sansAccent(S.recherche.trim());
  const base = S.clients.filter((c) => !q || sansAccent([nomAffiche(c), c.prenom, c.nom, c.societe, c.ville, c.code_postal, c.email, c.telephone, chiffres(c.telephone), c.commentaires].join(' ')).includes(q));
  const compte = (f) => base.filter((c) => passeFiltre(c, f)).length;
  const filtresEl = $('#filtres-clients');
  if (filtresEl) filtresEl.innerHTML = FILTRES.map((f) => `<button class="puce ${S.filtre === f.id ? 'on' : ''}" style="${f.c ? `--c:${f.c}` : ''}" data-action="filtre-clients" data-filtre="${f.id}">${f.c ? '<span class="pastille" style="--c:' + f.c + '"></span>' : ''}${f.libelle}<span class="nb">${compte(f.id)}</span></button>`).join('');

  let liste = base.filter((c) => passeFiltre(c, S.filtre));
  const rang = (c) => ({ rouge: 0, orange: 1, ok: 2 }[niveauClient(c.id)]);
  if (S.tri === 'nom') liste.sort((a, b) => nomAffiche(a).localeCompare(nomAffiche(b), 'fr', { sensitivity: 'base' }));
  if (S.tri === 'recent') liste.sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  if (S.tri === 'alertes') liste.sort((a, b) => rang(a) - rang(b) || nomAffiche(a).localeCompare(nomAffiche(b), 'fr'));

  const compteEl = $('#compte-clients');
  if (compteEl) compteEl.textContent = `${pluriel(S.clients.length, 'client')} au total${liste.length !== S.clients.length ? `, ${liste.length} affiché${liste.length > 1 ? 's' : ''}` : ''}`;

  const zone = $('#liste-clients');
  if (!zone) return;
  if (!S.clients.length) {
    zone.innerHTML = `<div class="vide"><strong>Aucun client pour l’instant</strong>Crée ta première fiche : elle sera visible par toute l’équipe.<br><button class="btn btn-flash" data-action="nouveau-client">${ico('plus')} Nouveau client</button></div>`;
    return;
  }
  if (!liste.length) {
    zone.innerHTML = `<div class="vide"><strong>Aucun client ne correspond</strong>Modifie la recherche ou le filtre.</div>`;
    return;
  }
  zone.innerHTML = `
    <div class="ligne entete"><span></span><span>Client</span><span class="col-contact">Contact</span><span class="col-ville">Ville et source</span><span>État de la fiche</span><span></span></div>
    ${liste.map((c) => {
      const al = S.alertes.get(c.id) || [];
      const sec = [sousNom(c), c.ville].filter(v).join(', ');
      return `<div class="ligne" data-action="ouvrir-fiche" data-id="${esc(c.id)}">
        <div class="type-ico" style="${styleType(c.type)}" title="${TYPES[c.type]?.libelle}">${ico(TYPES[c.type]?.icone)}</div>
        <div class="col-id"><div class="nom">${esc(nomAffiche(c))}</div><div class="sec">${esc(sec) || '<span class="doux">—</span>'}</div></div>
        <div class="col-contact"><div class="sec" style="color:var(--txt)">${esc(c.telephone || '—')}</div><div class="sec">${esc(c.email || '')}</div></div>
        <div class="col-ville"><div class="sec" style="color:var(--txt)">${esc(c.ville || '—')}</div><div class="sec">${esc(c.source || '')}</div></div>
        <div class="col-alertes alertes">${al.length ? al.slice(0, 2).map((a) => `<span class="alerte ${a.niveau}">${esc(a.court)}</span>`).join('') + (al.length > 2 ? `<span class="alerte ${al[2].niveau}">+${al.length - 2}</span>` : '') : '<span class="alerte ok">Complète</span>'}</div>
        <div class="col-actions contacts">${boutonsContact(c)}</div>
      </div>`;
    }).join('')}`;
}

function boutonsContact(c, large = false) {
  const tel = v(c.telephone) && telValide(c.telephone) ? normTel(c.telephone) : '';
  const pref = c.contact_prefere;
  const b = (href, icone, libelle, estPref, externe) =>
    `<a class="ac ${estPref ? 'pref' : ''}" href="${esc(href)}" ${externe ? 'target="_blank" rel="noopener"' : ''} title="${libelle}${estPref ? ' (préféré)' : ''}" aria-label="${libelle}${estPref ? ' (moyen préféré)' : ''}">${ico(icone)}${large ? `<span>${libelle}</span>` : ''}</a>`;
  const out = [];
  if (tel) {
    out.push(b('tel:' + tel, 'tel', 'Appeler', pref === 'Appel'));
    out.push(b('sms:' + tel, 'sms', 'SMS', pref === 'SMS'));
    out.push(b('https://wa.me/' + telWhatsApp(tel), 'whatsapp', 'WhatsApp', pref === 'WhatsApp', true));
  }
  if (v(c.email) && mailValide(c.email)) out.push(b('mailto:' + c.email.trim(), 'mail', 'Mail', pref === 'Mail'));
  return out.join('');
}

/* ---------- Fiche client (tiroir) ---------- */
const ouvrirFiche = (id) => { S.ficheParNous = true; location.hash = construireHash(S.view, { ...lireHash().p, fiche: id }); };

function afficherFiche(id) {
  if (id === 'nouveau') {
    S.ficheOrig = { type: 'particulier' };
  } else {
    const c = S.clients.find((x) => x.id === id);
    if (!c) { toast('Ce client n’existe plus.', 'erreur'); history.replaceState(null, '', construireHash(S.view, sansFiche(lireHash().p))); return; }
    S.ficheOrig = clone(c);
  }
  S.fiche = clone(S.ficheOrig);
  S.sortieOk = false;
  renderFiche();
  document.body.classList.add('bloque');
  if (id === 'nouveau') setTimeout(() => $('#f-prenom')?.focus(), 250);
}

function cacherFiche() {
  S.fiche = null; S.ficheOrig = null; S.sortieOk = false;
  $('#surcouche').innerHTML = '';
  document.body.classList.remove('bloque');
  if (S.renduDiffere) renderVue();
}

async function fermerFiche() {
  if (!S.fiche) return;
  if (!S.sortieOk && ficheModifiee()) {
    const ok = await confirmer({ titre: 'Quitter sans enregistrer ?', texte: 'Les modifications de cette fiche seront perdues.', ok: 'Quitter', danger: true });
    if (!ok) return;
  }
  S.sortieOk = true;
  if (S.ficheParNous) history.back();
  else { history.replaceState(null, '', construireHash(S.view, sansFiche(lireHash().p))); cacherFiche(); }
}

const valeurNette = (x) => (v(x) ? String(x).trim() : null);
function ficheModifiee() {
  if (!S.fiche || !S.ficheOrig) return false;
  return CHAMPS_CLIENT.some((k) => valeurNette(S.fiche[k]) !== valeurNette(S.ficheOrig[k]));
}

function champ(nom, libelle, o = {}) {
  return `<div class="champ ${o.large ? 'large' : ''}" data-champ="${nom}">
    <label for="f-${nom}">${libelle}</label>
    <input id="f-${nom}" data-f="${nom}" type="${o.type || 'text'}" ${o.mode ? `inputmode="${o.mode}"` : ''} autocomplete="${o.ac || 'off'}" value="${esc(S.fiche[nom] || '')}" placeholder="${esc(o.ph || '')}">
    <div class="indice"></div>
  </div>`;
}
function pucesChoix(nom, options) {
  const val = S.fiche[nom];
  const liste = [...options];
  if (v(val) && !liste.includes(val)) liste.push(val);
  return liste.map((o) => `<button type="button" class="puce ${val === o ? 'on' : ''}" data-action="choix-puce" data-champ="${nom}" data-valeur="${esc(o)}">${esc(o)}</button>`).join('');
}

function renderFiche() {
  const f = S.fiche, o = S.ficheOrig, nouveau = !f.id;
  const meta = nouveau ? '' : `Créé ${quand(o.created_at)} par ${associeDe(o.created_by).prenom}` +
    (o.updated_at && o.updated_at !== o.created_at ? `, modifié ${quand(o.updated_at)} par ${associeDe(o.updated_by).prenom}` : '');
  $('#surcouche').innerHTML = `
    <div class="voile" data-action="fermer-fiche"></div>
    <aside class="tiroir" role="dialog" aria-modal="true" aria-labelledby="fiche-titre">
      <header class="tiroir-tete">
        <div class="type-ico" id="fiche-ico" style="${styleType(f.type)}">${ico(TYPES[f.type].icone)}</div>
        <div class="tiroir-titres">
          <div class="tiroir-sur">${nouveau ? 'Nouveau client' : 'Client n° ' + String(f.numero || '').padStart(4, '0')}</div>
          <h2 id="fiche-titre">${esc(nomAffiche(f) || 'Sans nom')}</h2>
          ${meta ? `<div class="tiroir-meta">${esc(meta)}</div>` : ''}
        </div>
        <button class="btn btn-icone" data-action="fermer-fiche" aria-label="Fermer">${ico('x')}</button>
      </header>
      <div class="tiroir-corps" id="fiche-corps">${corpsFiche()}</div>
      <footer class="tiroir-pied">
        ${nouveau ? '' : `<button class="btn btn-danger btn-icone" data-action="supprimer-client" title="Supprimer" aria-label="Supprimer ce client">${ico('poubelle')}</button>`}
        <span class="espace"></span>
        <button class="btn" data-action="fermer-fiche">Annuler</button>
        <button class="btn btn-flash" data-action="enregistrer-client" id="btn-enregistrer">${ico('check')} Enregistrer</button>
      </footer>
    </aside>`;
  majFicheAlertes();
}

function corpsFiche() {
  const f = S.fiche, pro = f.type !== 'particulier';
  const contacts = f.id ? boutonsContact(S.ficheOrig, true) : '';
  return `
    <div id="fiche-bandeau"></div>
    ${contacts ? `<div class="contacts large" style="margin-bottom:14px">${contacts}</div>` : ''}
    <section class="bloc"><h3>Type de client</h3>
      <div class="choix-type">${Object.entries(TYPES).map(([k, t]) => `<button type="button" class="${f.type === k ? 'on' : ''}" style="${styleType(k)}" data-action="type-client" data-type="${k}">${ico(t.icone)}${t.libelle}</button>`).join('')}</div>
    </section>
    <section class="bloc"><h3>Identité</h3>
      <div class="grille">
        ${pro ? champ('societe', f.type === 'entreprise' ? 'Nom de l’entreprise' : 'Nom de l’association', { large: true, ac: 'organization' }) : ''}
        ${champ('prenom', pro ? 'Prénom du contact' : 'Prénom', { ac: 'given-name' })}
        ${champ('nom', pro ? 'Nom du contact' : 'Nom', { ac: 'family-name' })}
        ${f.type === 'entreprise' ? champ('siren', 'SIREN', { mode: 'numeric', ph: '9 chiffres' }) : ''}
      </div>
    </section>

      <div class="grille">
        ${champ('telephone', 'Téléphone', { type: 'tel', mode: 'tel', ph: '06 12 34 56 78', ac: 'tel' })}
        ${champ('email', 'Mail', { type: 'email', mode: 'email', ph: 'nom@exemple.fr', ac: 'email' })}
      </div>
      <div class="sous-bloc" data-champ="contact_prefere">
        <span class="etiquette">Moyen de contact préféré</span>
        <div class="puces" id="puces-contact_prefere">${pucesChoix('contact_prefere', param('contacts_preferes'))}</div>
        <div class="indice"></div>
      </div>
    </section>
    <section class="bloc"><h3>Adresse de facturation</h3>
      <div class="grille">
        ${champ('adresse', 'Adresse', { large: true, ph: 'N° et rue', ac: 'street-address' })}
        ${champ('code_postal', 'Code postal', { mode: 'numeric', ph: '95170', ac: 'postal-code' })}
        ${champ('ville', 'Ville', { ac: 'address-level2' })}
      </div>
    </section>
    <section class="bloc" data-champ="source"><h3>Comment nous a-t-il connus ?</h3>
      <div class="puces" id="puces-source">${pucesChoix('source', param('sources'))}</div>
      <div class="indice" style="margin-top:8px"></div>
    </section>
    <section class="bloc"><h3>Commentaires</h3>
      <div class="champ"><label for="f-commentaires" class="sr">Commentaires</label>
      <textarea id="f-commentaires" data-f="commentaires" placeholder="Événement prévu, attentes, infos utiles…">${esc(S.fiche.commentaires || '')}</textarea></div>
    </section>
    ${S.fiche.id ? blocDevisClient(S.fiche.id) : ''}
    ${S.fiche.id ? blocPrestationsClient(S.fiche.id) : ''}
    ${S.fiche.id ? blocFacturesClient(S.fiche.id) : ''}`;
}

function majFicheAlertes() {
  if (!S.fiche) return;
  const al = alertesClient(S.fiche);
  $$('#fiche-corps [data-champ]').forEach((el) => {
    el.classList.remove('manque-rouge', 'manque-orange');
    const i = el.querySelector('.indice'); if (i) i.textContent = '';
  });
  for (const a of [...al].reverse()) {
    for (const ch of a.champs) {
      const el = $(`#fiche-corps [data-champ="${ch}"]`);
      if (!el) continue;
      if (a.niveau === 'rouge') el.classList.remove('manque-orange');
      if (!(a.niveau === 'orange' && el.classList.contains('manque-rouge'))) el.classList.add('manque-' + a.niveau);
      const i = el.querySelector('.indice');
      if (i) i.textContent = a.indice;
    }
  }
  const b = $('#fiche-bandeau');
  if (b) {
    const rouges = al.filter((a) => a.niveau === 'rouge'), oranges = al.filter((a) => a.niveau === 'orange');
    if (!al.length) b.innerHTML = `<div class="bandeau ok">${ico('check')}<div><strong>Fiche complète</strong>Toutes les infos demandées sont renseignées.</div></div>`;
    else b.innerHTML = `<div class="bandeau ${rouges.length ? 'rouge' : 'orange'}">${ico('alerte')}<div><strong>${rouges.length ? pluriel(rouges.length, 'info bloquante') + (oranges.length ? `, ${oranges.length} à compléter` : '') : pluriel(oranges.length, 'info') + ' à compléter'}</strong><div class="alertes">${al.map((a) => `<span class="alerte ${a.niveau}">${esc(a.court)}</span>`).join('')}</div></div></div>`;
  }
  const t = $('#fiche-titre'); if (t) t.textContent = nomAffiche(S.fiche) || 'Sans nom';
}

async function enregistrerClient() {
  if (S.enCours) return;
  const f = {};
  for (const k of CHAMPS_CLIENT) f[k] = valeurNette(S.fiche[k]);
  f.type = S.fiche.type;
  if (!v(f.nom) && !v(f.societe)) {
    toast(f.type === 'particulier' ? 'Renseigne au moins le nom du client.' : 'Renseigne au moins le nom de la structure ou du contact.', 'erreur');
    $(f.type === 'particulier' ? '#f-nom' : '#f-societe')?.focus();
    return;
  }
  if (f.type === 'particulier') f.societe = null;
  if (f.type !== 'entreprise') f.siren = null;
  if (v(f.telephone) && telValide(f.telephone)) f.telephone = formatTel(f.telephone);
  if (v(f.siren) && sirenValide(f.siren)) f.siren = formatSiren(f.siren);
  if (v(f.email)) f.email = f.email.toLowerCase();

  S.enCours = true;
  const btn = $('#btn-enregistrer'); if (btn) btn.disabled = true;
  try {
    if (!S.fiche.id) {
      await DB.creerClient(f);
      toast('Client créé');
    } else {
      const patch = {};
      for (const k of CHAMPS_CLIENT) if (f[k] !== valeurNette(S.ficheOrig[k])) patch[k] = f[k];
      if (Object.keys(patch).length) { await DB.majClient(S.fiche.id, patch); toast('Modifications enregistrées'); }
      else toast('Aucune modification');
    }
    S.sortieOk = true;
    await fermerFiche();
    await recharger();
  } catch (err) {
    toast(messageErreur(err), 'erreur');
  } finally {
    S.enCours = false;
    const b2 = $('#btn-enregistrer'); if (b2) b2.disabled = false;
  }
}

async function supprimerClient() {
  const nom = nomAffiche(S.ficheOrig);
  const ok = await confirmer({ titre: 'Supprimer ce client ?', texte: `La fiche « ${nom} » sera supprimée pour toute l’équipe. L’action reste tracée dans le journal.`, ok: 'Supprimer', danger: true });
  if (!ok) return;
  try {
    await DB.supprimerClient(S.fiche.id);
    toast('Client supprimé');
    S.sortieOk = true;
    await fermerFiche();
    await recharger();
  } catch (err) { toast(messageErreur(err), 'erreur'); }
}

/* =====================================================================
   Journal
   ===================================================================== */
const pictoAction = (a) => ({ 'création': 'creation', 'modification': 'modification', 'suppression': 'suppression', statut: 'statut' }[a] || 'modification');
const iconeAction = (a) => ({ 'création': 'plus', 'modification': 'crayon', 'suppression': 'poubelle', statut: 'envoi' }[a] || 'crayon');
function phraseJournal(j) {
  const verbe = { 'création': 'a créé', 'modification': 'a modifié', 'suppression': 'a supprimé' }[j.action] || j.action;
  if (j.module === 'Devis') return j.action === 'statut' ? `a passé le devis « ${j.cible} » en « ${STATUTS[j.details]?.libelle || j.details || '?'} »` : `${verbe} le devis « ${j.cible} »`;
  if (j.module === 'Prestations') return j.action === 'statut' ? `a passé la prestation « ${j.cible} » en « ${STATUTS_PR[j.details]?.libelle || j.details || '?'} »` : `${verbe} la prestation « ${j.cible} »`;
  if (j.module === 'Répartition') return j.action === 'statut' ? `a marqué la répartition « ${j.cible} » comme « ${j.details === 'reglee' ? 'Réglée' : 'À régler'} »` : `${verbe} la répartition « ${j.cible} »`;
  if (j.module === 'Fonds') return `${verbe} le mouvement de fonds « ${j.cible} »`;
  if (j.module === 'Commandes') return j.action === 'statut' ? `a marqué la commande « ${j.cible} » comme « ${STATUTS_CMD[j.details]?.libelle || j.details} »` : `${verbe} la commande « ${j.cible} »`;
  if (j.module === 'Dépenses') return `${verbe} la dépense « ${j.cible} »`;
  if (j.module === 'Matériel') return `${verbe} le matériel « ${j.cible} »`;
  if (j.module === 'Consommables') return `${verbe} le consommable « ${j.cible} »`;
  if (j.module === 'Stock') return `a corrigé le stock « ${j.cible} »`;
  if (j.module === 'Factures') return j.action === 'statut' ? `a émis la facture « ${j.cible} »` : j.action === 'création' ? `a créé un brouillon de facture « ${j.cible} »` : `${verbe} la facture « ${j.cible} »`;
  if (j.module === 'Paiements') return j.action === 'création' ? `a enregistré le paiement « ${j.cible} »` : `${verbe} le paiement « ${j.cible} »`;
  if (j.module === 'Indisponibilités') return `${verbe} l’indisponibilité « ${j.cible} »`;
  if (j.module === 'Modèles de devis') return `${verbe} le modèle de devis « ${j.cible} »`;
  if (j.module === 'Paramètres') return `${verbe} le réglage « ${LIBELLES_PARAMS[j.cible] || j.cible} »`;

function listeJournal() {
  const q = sansAccent(S.jFiltre.q.trim());
  const liste = S.journal.filter((j) =>
    (S.jFiltre.personne === 'tous' || j.auteur === S.jFiltre.personne) &&
    (S.jFiltre.module === 'tous' || j.module === S.jFiltre.module) &&
    (!q || sansAccent([j.cible, LIBELLES_PARAMS[j.cible], j.module, associeDe(j.auteur).prenom].join(' ')).includes(q)));
  if (!liste.length) return `<div class="panneau"><div class="vide"><strong>Aucune action</strong>Rien ne correspond à ces filtres.</div></div>`;
  const groupes = [];
  for (const j of liste) {
    const cle = libelleJour(j.date_action);
    if (!groupes.length || groupes[groupes.length - 1].cle !== cle) groupes.push({ cle, items: [] });
    groupes[groupes.length - 1].items.push(j);
  }
  return groupes.map((g) => `
    <div class="jour"><h3>${esc(g.cle)}</h3>
      <div class="panneau">${g.items.map((j) => {
        const a = associeDe(j.auteur);

      }).join('')}</div>

}

async function enregistrerSection(section) {
  const b = S.brouillon;
  try {
    if (section === 'entreprise') {
      if (!v(b.entreprise.nom)) { toast('Le nom de l’entreprise ne peut pas être vide.', 'erreur'); return; }
      const ent = Object.fromEntries(Object.entries(b.entreprise).map(([k, x]) => [k, typeof x === 'string' && k !== 'logo' ? x.trim() : x]));
      if (v(ent.siret) && ent.siret.replace(/\s/g, '').length !== 14) toast('Attention : un SIRET compte normalement 14 chiffres.', 'erreur');
      await DB.majParam('entreprise', ent);
    } else if (section === 'devis') {
      const d = b.devis, prefixe = String(d.prefixe || '').trim().toUpperCase();
      if (!prefixe || /[^A-Z0-9]/.test(prefixe)) { toast('Préfixe : lettres et chiffres uniquement, ex. DV.', 'erreur'); return; }
      const acompte = num(d.acompte_pct);
      if (acompte < 0 || acompte > 100) { toast('L’acompte doit être compris entre 0 et 100 %.', 'erreur'); return; }
      await DB.majParam('devis', {
        ...d, prefixe, chiffres: Math.round(num(d.chiffres)) || 4, prochain_numero: Math.max(1, Math.round(num(d.prochain_numero)) || 1),
        acompte_pct: acompte, validite_jours: Math.max(1, Math.round(num(d.validite_jours)) || 30), relance_jours: Math.max(1, Math.round(num(d.relance_jours)) || 7),
      });
    } else if (section === 'repartition') {
      const d = b.repartition;
      const parts = { part_compte: num(d.part_compte), part_egale: num(d.part_egale), part_roles: num(d.part_roles) };
      if (Object.values(parts).some((x) => x < 0)) { toast('Les pourcentages ne peuvent pas être négatifs.', 'erreur'); return; }
      if (parts.part_egale + parts.part_roles > 100) { toast('Les parts distribuées dépassent 100 % du montant.', 'erreur'); return; }
      const points = Object.fromEntries(Object.entries(d.points).map(([k, x]) => [k, Math.max(0, num(x))]));
      await DB.majParam('repartition', { ...d, ...parts, points });
    } else if (section === 'materiel') {
      const d = b.materiel, tir = Math.round(num(d.tirages_moyens)), hor = Math.round(num(d.horizon_jours));
      if (tir < 0) { toast('Le nombre de tirages ne peut pas être négatif.', 'erreur'); return; }
      if (hor < 1) { toast('La prévision doit couvrir au moins 1 jour.', 'erreur'); return; }
      await DB.majParam('materiel', { ...d, tirages_moyens: tir, horizon_jours: hor });
    } else if (section === 'facturation') {
      const d = { ...b.facturation };
      if (!/^[A-Za-z]{1,6}$/.test(String(d.prefixe_facture).trim()) || !/^[A-Za-z]{1,6}$/.test(String(d.prefixe_avoir).trim())) { toast('Les préfixes doivent contenir 1 à 6 lettres.', 'erreur'); return; }
      if (d.prefixe_facture.trim().toUpperCase() === d.prefixe_avoir.trim().toUpperCase()) { toast('Les factures et les avoirs doivent avoir des préfixes différents.', 'erreur'); return; }
      for (const k of ['echeance_acompte_jours', 'echeance_solde_jours_avant', 'delai_paiement_jours', 'relance_jours']) d[k] = Math.max(0, Math.round(num(d[k])));
      if (d.relance_jours < 1) d.relance_jours = 7;
      d.prefixe_facture = d.prefixe_facture.trim().toUpperCase(); d.prefixe_avoir = d.prefixe_avoir.trim().toUpperCase();
      await DB.majParam('facturation', d);
    } else if (section === 'planning') {
      const d = b.planning, nb = Math.round(num(d.nb_bornes)), delai = num(d.delai_installation_h), j = Math.round(num(d.alerte_roles_jours));
      if (nb < 1) { toast('Il faut au moins une borne.', 'erreur'); return; }
      if (delai < 0 || delai > 12) { toast('Le délai d’installation doit être compris entre 0 et 12 heures.', 'erreur'); return; }
      if (j < 1) { toast('L’alerte doit être d’au moins 1 jour.', 'erreur'); return; }
      await DB.majParam('planning', { ...d, nb_bornes: nb, delai_installation_h: delai, alerte_roles_jours: j });
    } else if (section === 'catalogue') {
      const liste = b.catalogue.filter((a) => v(a.libelle)).map((a) => ({ categorie: a.categorie || 'Autre', libelle: a.libelle.trim(), description: String(a.description || '').trim(), prix: num(a.prix), unite: a.unite || 'forfait' }));
      await DB.majParam('catalogue', liste);
    } else if (section === 'sources' || section === 'contacts_preferes' || section === 'types_evenement') {
      const liste = [...new Set(b[section].map((x) => x.trim()).filter(Boolean))];
      await DB.majParam(section, liste);
    } else if (section === 'alertes_clients') {
      await DB.majParam('alertes_clients', b.alertes_clients);
    } else if (section === 'associes') {
      const lignes = b.associes.map((a) => ({ ...a, prenom: a.prenom.trim(), nom: a.nom.trim(), email: a.email.trim().toLowerCase(), initiales: (a.initiales.trim() || initialesAuto(a)).toUpperCase() }));
      if (lignes.some((a) => !a.prenom)) { toast('Chaque associé doit avoir un prénom.', 'erreur'); return; }
      const mails = lignes.map((a) => a.email).filter(Boolean);
      if (new Set(mails).size !== mails.length) { toast('Deux associés ont le même mail.', 'erreur'); return; }
      if (lignes.some((a) => a.email && !mailValide(a.email))) { toast('Un mail d’associé semble incorrect.', 'erreur'); return; }
      for (const id of S.associesSuppr) await DB.supprimerAssocie(id);
      for (const [idx, a] of lignes.entries()) {
        const row = { prenom: a.prenom, nom: a.nom || null, initiales: a.initiales, couleur: a.couleur, email: a.email || null };
        if (!a.id) { await DB.creerAssocie(row); continue; }
        const orig = S.original.associes.find((x) => x.id === a.id);
        if (JSON.stringify(b.associes[idx]) === JSON.stringify(orig)) continue; // ligne non touchée
        const patch = {};
        for (const k of Object.keys(row)) if ((row[k] || null) !== ((k === 'initiales' ? (orig[k] || '').toUpperCase() : orig[k]) || null)) patch[k] = row[k];
        if (Object.keys(patch).length) await DB.majAssocie(a.id, patch);
      }
      S.associesSuppr = [];
    }
    await chargerDonnees();
    S.brouillon[section] = clone(S.original[section]);
    toast('Réglages enregistrés');
    majCoque();
    renderVue();
  } catch (err) { toast(messageErreur(err), 'erreur'); }
}

/* ---------- Nombres, montants, dates ---------- */
const num = (x) => Number(String(x ?? '').replace(/\s/g, '').replace(',', '.')) || 0;
const cts = (x) => Math.round(num(x) * 100);
const eur = (c) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format((c || 0) / 100).replace(/\u202f/g, '\u00a0');
const fmtNombre = (x) => String(Math.round(num(x) * 100) / 100).replace('.', ',');
const isoDe = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const aujourdhui = () => isoDe(new Date());
const versDate = (x) => (x instanceof Date ? x : new Date(String(x).length <= 10 ? x + 'T12:00:00' : x));
const dateLongue = (x, jour = false) => v(x) ? new Intl.DateTimeFormat('fr-FR', { weekday: jour ? 'long' : undefined, day: 'numeric', month: 'long', year: 'numeric' }).format(versDate(x)) : '';
const dateCourte = (x) => v(x) ? new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }).format(versDate(x)) : '';
const hhmm = (t) => (v(t) ? String(t).slice(0, 5).replace(':', 'h') : '');
const ajouterJours = (iso, n) => { const d = versDate(iso || aujourdhui()); d.setDate(d.getDate() + Number(n || 0)); return d; };
const joursDepuis = (x) => Math.floor((debutJour(new Date()) - debutJour(x)) / 864e5);
const totalCts = (d) => Math.round(num(d.total) * 100);
const somme = (liste) => liste.reduce((s, d) => s + totalCts(d), 0);
const nomClient = (id) => nomAffiche(S.clients.find((c) => c.id === id)) || 'Client supprimé';
const initialesDe = (email) => { const a = associeDe(email); return a.initiales || initialesAuto(a) || (a.prenom || '?').charAt(0).toUpperCase(); };

// 1 -> A, 2 -> B … 27 -> AA
function indiceLettre(n) {
  let reste = Math.max(1, Math.round(num(n)) || 1), txt = '';
  while (reste > 0) { reste -= 1; txt = String.fromCharCode(65 + (reste % 26)) + txt; reste = Math.floor(reste / 26); }
  return txt;
}
function refDevis(annee, numero, version, conf = param('devis')) {
  const an = String(Math.round(num(annee)) % 100).padStart(4, '0');
  return `${conf.prefixe || 'DV'}-${an}-${String(numero).padStart(Number(conf.chiffres) || 3, '0')}-${indiceLettre(version)}`;
}
function prochainNumero(conf = param('devis')) {
  const an = new Date().getFullYear();   // les numéros repartent à 1 chaque année
  const memeAnnee = S.devis.filter((d) => (d.annee || 0) === an);
  return Math.max(Math.max(0, ...memeAnnee.map((d) => d.numero || 0)) + 1, Number(conf.prochain_numero) || 1);
}
const cibleDevis = (d) => [d.reference, nomClient(d.client_id)].filter(Boolean).join(' – ');

/* ---------- Calculs ---------- */
function calculerDevis(d) {
  const lignes = (d.lignes || []).map((l) => ({ ...l, montant: Math.round(num(l.quantite) * cts(l.prix_unitaire)) }));
  const sousTotal = lignes.reduce((s, l) => s + l.montant, 0);
  let remise = d.remise_type === '€' ? cts(d.remise_valeur) : Math.round(sousTotal * num(d.remise_valeur) / 100);
  remise = Math.min(Math.max(remise, 0), sousTotal);
  const total = sousTotal - remise;
  const acompte = Math.round(total * num(d.acompte_pct) / 100);
  return { lignes, sousTotal, remise, total, acompte, solde: total - acompte };
}
function statutDevis(d) {
  if (d.statut === 'envoye' && v(d.date_devis) && debutJour(ajouterJours(d.date_devis, d.validite_jours || 30)) < debutJour(new Date())) return 'expire';
  return d.statut;
}
function aRelancer(d) {
  if (statutDevis(d) !== 'envoye') return false;
  const base = d.date_relance || d.date_envoi;
  return !!base && joursDepuis(base) >= (Number(param('devis').relance_jours) || 7);
}
function alertesEntreprise(e = param('entreprise')) {
  const r = [];
  if (!v(e.siret)) r.push('SIRET');
  if (!v(e.adresse) || !v(e.code_postal) || !v(e.ville)) r.push('adresse');
  if (!v(e.telephone) && !v(e.email)) r.push('téléphone ou mail');
  if (!v(e.iban)) r.push('IBAN');
  return r;
}
function alertesDevis(d) {
  const r = [];
  const c = S.clients.find((x) => x.id === d.client_id);
  if (!c) r.push({ niveau: 'rouge', texte: 'Aucun client choisi' });
  else {
    const rc = (S.alertes.get(c.id) || []).filter((a) => a.niveau === 'rouge');
    if (rc.length) r.push({ niveau: 'rouge', texte: 'Fiche client incomplète : ' + rc.map((a) => a.court.toLowerCase()).join(', '), fiche: c.id });
  }
  const lignes = d.lignes || [];
  if (!lignes.length) r.push({ niveau: 'rouge', texte: 'Aucune prestation' });
  if (lignes.some((l) => !v(l.libelle))) r.push({ niveau: 'orange', texte: 'Une ligne n’a pas de désignation' });
  if (lignes.some((l) => v(l.libelle) && cts(l.prix_unitaire) === 0)) r.push({ niveau: 'orange', texte: 'Une ligne est à 0 €' });
  if (!v(d.date_evenement)) r.push({ niveau: 'orange', texte: 'Date de l’événement manquante' });
  if (!v(d.lieu_nom) && !v(d.lieu_ville)) r.push({ niveau: 'orange', texte: 'Lieu de l’événement manquant' });
  const e = alertesEntreprise();
  if (e.length) r.push({ niveau: 'orange', texte: 'Infos entreprise : ' + e.join(', '), params: true });
  return r;
}

/* ---------- Conversion édition <-> enregistrement ---------- */
const hhmmSaisie = (t) => (v(t) ? String(t).slice(0, 5) : '');
function editable(d) {
  const e = {};
  for (const [k, val] of Object.entries(d)) e[k] = val == null ? '' : val;
  e.heure_debut = hhmmSaisie(d.heure_debut);
  e.heure_fin = hhmmSaisie(d.heure_fin);
  e.nb_invites = d.nb_invites == null || d.nb_invites === '' ? '' : String(d.nb_invites);
  e.lignes = (d.lignes || []).map((l) => ({
    libelle: l.libelle || '', description: l.description || '',
    quantite: l.quantite == null || l.quantite === '' ? '1' : fmtNombre(l.quantite),
    prix_unitaire: l.prix_unitaire == null || l.prix_unitaire === '' ? '' : fmtNombre(l.prix_unitaire),
    unite: l.unite || 'forfait',
  }));
  e.remise_type = d.remise_type === '€' ? '€' : '%';
  e.remise_valeur = fmtNombre(d.remise_valeur || 0);
  e.acompte_pct = fmtNombre(d.acompte_pct ?? 30);
  e.validite_jours = String(d.validite_jours ?? 30);
  return e;
}
function donneesDevis(d) {
  const nn = (x) => (v(x) ? String(x).trim() : null);
  const row = {
    client_id: d.client_id || null,
    objet: nn(d.objet), evenement_type: nn(d.evenement_type),
    date_evenement: nn(d.date_evenement), heure_debut: nn(d.heure_debut), heure_fin: nn(d.heure_fin),
    lieu_nom: nn(d.lieu_nom), lieu_adresse: nn(d.lieu_adresse), lieu_cp: nn(d.lieu_cp), lieu_ville: nn(d.lieu_ville),
    nb_invites: v(d.nb_invites) ? Math.round(num(d.nb_invites)) : null,
    preambule: nn(d.preambule),
    lignes: (d.lignes || []).map((l) => ({
      libelle: String(l.libelle || '').trim(), description: String(l.description || '').trim(),
      quantite: num(l.quantite), prix_unitaire: num(l.prix_unitaire), unite: l.unite || 'forfait',
    })),
    remise_type: d.remise_type === '€' ? '€' : '%',
    remise_valeur: num(d.remise_valeur),
    acompte_pct: num(d.acompte_pct),
    validite_jours: Math.max(1, Math.round(num(d.validite_jours)) || 30),
    conditions: nn(d.conditions),
    notes_internes: nn(d.notes_internes),
    date_devis: d.date_devis || aujourdhui(),
  };
  row.total = calculerDevis(row).total / 100;
  return row;
}
const devisModifie = () => !!S.dv && JSON.stringify(donneesDevis(S.dv)) !== JSON.stringify(donneesDevis(S.dvBase));
const notesModifiees = () => !!S.dv && valeurNette(S.dv.notes_internes) !== valeurNette(S.dvBase.notes_internes);

/* ---------- Ouverture de l'éditeur ---------- */
function ouvrirEditeurDevis(id, p = {}) {
  if (id === 'nouveau') {
    const cfg = param('devis');
    const modele = p.modele ? S.modeles.find((m) => m.id === p.modele) : null;
    S.dvOrig = null;
    S.dv = editable({
      id: null, client_id: p.client || null, statut: 'brouillon',
      objet: modele?.objet, evenement_type: modele?.evenement_type, preambule: modele?.preambule,
      lignes: modele?.lignes || [], remise_type: modele?.remise_type || '%', remise_valeur: modele?.remise_valeur || 0,
      acompte_pct: cfg.acompte_pct, validite_jours: cfg.validite_jours, conditions: cfg.conditions,
      etabli_par: S.user.email, date_devis: aujourdhui(),
    });
  } else {
    const d = S.devis.find((x) => x.id === id);
    if (!d) {
      toast('Ce devis n’existe plus.', 'erreur');
      history.replaceState(null, '', '#devis');
      S.dv = null; S.dvId = null;
      return;
    }
    S.dvOrig = clone(d);
    S.dv = editable(d);
  }
  S.dvBase = clone(S.dv);
  S.dvId = id;
  prechargerPdf();
}

const FILTRES_DEVIS = [
  { id: 'tous', libelle: 'Tous' },
  { id: 'brouillon', libelle: 'Brouillons', c: '#555A74' },
  { id: 'envoye', libelle: 'Envoyés', c: '#1D4ED8' },
  { id: 'relance', libelle: 'À relancer', c: 'var(--orange)' },
  { id: 'accepte', libelle: 'Acceptés', c: 'var(--vert)' },
  { id: 'refuse', libelle: 'Refusés', c: 'var(--rouge)' },

  { id: 'remplace', libelle: 'Anciens indices', c: '#8A8FA8' },
];
function passeFiltreDevis(d, f) {
  const s = statutDevis(d);
  if (f === 'tous') return s !== 'remplace';
  if (f === 'relance') return aRelancer(d);
  return s === f;
}

function metaDevis(d) {
  const a = associeDe(d.etabli_par);
  const morceaux = [`Établi par ${initialesDe(d.etabli_par)} ${quand(d.created_at)}`];
  if (d.date_envoi) morceaux.push(`envoyé ${quand(d.date_envoi)}`);
  if (d.date_relance) morceaux.push(`relancé ${quand(d.date_relance)}`);
  if (d.date_reponse && (d.statut === 'accepte' || d.statut === 'refuse')) morceaux.push(`${d.statut === 'accepte' ? 'accepté' : 'refusé'} ${quand(d.date_reponse)}`);
  return cap(morceaux.join(', '));
}
const memeDevis = (d) => S.devis.filter((x) => x.numero === d.numero && (x.annee || 0) === (d.annee || 0)).sort((a, b) => a.version - b.version);
function refSuivante() {
  if (!S.dvOrig) return '';
  const v2 = Math.max(0, ...memeDevis(S.dvOrig).map((x) => x.version)) + 1;
  return refDevis(S.dvOrig.annee, S.dvOrig.numero, v2);
}

}

/* ---------- Enregistrement et statuts ---------- */
async function enregistrerDevis(extra = {}, message = 'Devis enregistré') {
  if (S.enCours) return false;
  const row = donneesDevis(S.dv);
  if (!row.client_id) { toast('Choisis d’abord un client.', 'erreur'); return false; }
  S.enCours = true;
  try {
    if (!S.dv.id) {
      const cree = await DB.creerDevis({ ...row, statut: 'brouillon', etabli_par: S.user.email, ...extra });
      await chargerDonnees();
      history.replaceState(null, '', construireHash('devis', { id: cree.id }));
      ouvrirEditeurDevis(cree.id);
      toast(`${message} : ${cree.reference}`);
    } else {
      const base = donneesDevis(S.dvBase), brouillon = S.dvOrig.statut === 'brouillon', patch = {};
      for (const [k, val] of Object.entries(row)) {
        if (!brouillon && k !== 'notes_internes') continue; // contenu figé hors brouillon
        if (JSON.stringify(val) !== JSON.stringify(base[k])) patch[k] = val;
      }
      Object.assign(patch, extra);
      if (Object.keys(patch).length) await DB.majDevis(S.dvOrig.id, patch);
      await chargerDonnees();
      ouvrirEditeurDevis(S.dvOrig.id);
      toast(Object.keys(patch).length ? message : 'Aucune modification');
    }
    renderVue();
    return true;
  } catch (err) {
    toast(messageErreur(err), 'erreur');
    return false;
  } finally {
    S.enCours = false;
  }
}

async function changerStatutDevis(nouveau) {
  const d = S.dvOrig;
  if (!d) return false;
  const confirmations = {
    accepte: { titre: 'Le client a accepté ?', texte: `${d.reference} passera en « Accepté » et la prestation sera créée automatiquement au planning, avec les infos de l’événement.`, ok: 'Oui, accepté' },
    refuse: { titre: 'Le client a refusé ?', texte: `${d.reference} passera en « Refusé ». Tu pourras le rouvrir ou en faire une nouvelle version.`, ok: 'Oui, refusé', danger: true },
    brouillon: { titre: 'Repasser en brouillon ?', texte: 'À faire seulement si le devis n’a pas réellement été envoyé au client : il redeviendra modifiable sans changer de version.', ok: 'Repasser en brouillon' },
  };
  if (confirmations[nouveau] && !(await confirmer(confirmations[nouveau]))) return false;
  if (nouveau === 'envoye' && d.statut === 'accepte' && !(await confirmer({ titre: 'Annuler l’acceptation ?', texte: `${d.reference} repassera en « Envoyé » et la prestation liée sera annulée au planning.`, ok: 'Annuler l’acceptation', danger: true }))) return false;
  const now = new Date().toISOString(), extra = { statut: nouveau };
  if (nouveau === 'envoye' && d.statut === 'brouillon') Object.assign(extra, { date_envoi: now, date_devis: aujourdhui(), date_relance: null });
  if (nouveau === 'envoye' && (d.statut === 'accepte' || d.statut === 'refuse')) extra.date_reponse = null;
  if (nouveau === 'accepte' || nouveau === 'refuse') extra.date_reponse = now;
  if (nouveau === 'brouillon') Object.assign(extra, { date_envoi: null, date_relance: null });
  const msg = { envoye: d.statut === 'brouillon' ? 'Devis marqué comme envoyé' : 'Devis rouvert', accepte: 'Devis accepté', refuse: 'Devis marqué comme refusé', brouillon: 'Devis repassé en brouillon' }[nouveau];
  const ok = await enregistrerDevis(extra, msg);
  if (ok && nouveau === 'accepte') {
    try {
      const r = await assurerPrestationDevis(S.dvOrig);
      await chargerDonnees();
      renderVue();
      toast(r.cree ? 'Prestation créée au planning' : 'Prestation remise au planning');
    } catch (err) { toast('Devis accepté, mais la prestation n’a pas pu être créée : ' + messageErreur(err), 'erreur'); }
  }
  if (ok && d.statut === 'accepte' && nouveau !== 'accepte') {
    const pr = S.prestations.find((x) => x.devis_id === d.id && x.statut === 'a_venir');
    if (pr) {
      try { await DB.majPrestation(pr.id, { statut: 'annulee' }); await chargerDonnees(); renderVue(); toast('Prestation annulée au planning'); }
      catch (err) { toast(messageErreur(err), 'erreur'); }
    }
  }
  return ok;
}

  const d = S.dvOrig, ref = refSuivante();

/* ---------- PDF ---------- */
function chargerScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error('Impossible de charger le générateur de PDF : vérifie ta connexion internet.'));
    document.head.appendChild(s);
  });
}
function chargerPdfMake() {
  if (!S.pdfPromesse) {
    S.pdfPromesse = chargerScript(URL_PDFMAKE).then(() => chargerScript(URL_VFS)).catch((err) => { S.pdfPromesse = null; throw err; });
  }
  return S.pdfPromesse;
}
const prechargerPdf = () => { chargerPdfMake().catch(() => { /* on réessaiera au clic */ }); };

function nomFichierDevis(d) {
  return `${d.reference} - ${nomClient(d.client_id)}`.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim() + '.pdf';
}
function messageEnvoiDevis(d) {
  const c = S.clients.find((x) => x.id === d.client_id) || {};
  const evt = 'votre ' + [v(d.evenement_type) ? d.evenement_type.toLowerCase() : 'événement', v(d.date_evenement) ? 'du ' + dateLongue(d.date_evenement, true) : ''].filter(Boolean).join(' ');
  return String(param('devis').message_envoi || '')
    .replace(/\{prenom\}/g, c.prenom || nomAffiche(c) || '')
    .replace(/\{reference\}/g, d.reference)
    .replace(/\{evenement\}/g, evt)
    .replace(/\{expediteur\}/g, S.moi?.prenom || '')
    .replace(/\{entreprise\}/g, nomEntreprise());
}

function docDevis(d) {
  const e = param('entreprise'), c = S.clients.find((x) => x.id === d.client_id) || {};

async function pdfDevis() {
  if (!S.dv.client_id) { toast('Choisis d’abord un client.', 'erreur'); return; }
  const brouillon = S.dv.statut === 'brouillon';
  if (brouillon && (!S.dv.id || devisModifie())) {
    if (!(await enregistrerDevis({}, 'Devis enregistré'))) return;
  }
  const rouges = alertesDevis(S.dv).filter((a) => a.niveau === 'rouge');
  if (rouges.length && !(await confirmer({ titre: 'Infos bloquantes manquantes', texte: rouges.map((a) => a.texte).join(' ; ') + '. Générer le PDF quand même ?', ok: 'Générer quand même' }))) return;
  const d = { ...S.dvOrig };
  if (brouillon) d.date_devis = aujourdhui();
  ouvrirModale('<h2>Préparation du PDF…</h2><p>Quelques secondes.</p>', false);
  try {
    await chargerPdfMake();
    const blob = await new Promise((res, rej) => {
      const garde = setTimeout(() => rej(new Error('La génération du PDF a pris trop de temps. Réessaie.')), 20000);
      try { window.pdfMake.createPdf(docDevis(d)).getBlob((b) => { clearTimeout(garde); res(b); }); }
      catch (e) { clearTimeout(garde); rej(e); }
    });
    S.pdf = { blob, nom: nomFichierDevis(d), devis: d, brouillon, fichier: new File([blob], nomFichierDevis(d), { type: 'application/pdf' }) };
    modalePdfPret();
  } catch (err) {
    fermerModale();
    toast(messageErreur(err), 'erreur');
  }
}

  const url = URL.createObjectURL(S.pdf.blob);

async function creerClientRapide() {
  const val = valeursRapides(), type = S.pickType || 'particulier';
  if (!v(val.nom) && !v(val.societe)) { toast(type === 'particulier' ? 'Renseigne au moins le nom.' : 'Renseigne au moins le nom de la structure.', 'erreur'); return; }
  const row = {
    type, prenom: val.prenom || null, nom: val.nom || null,
    societe: type === 'particulier' ? null : (val.societe || null),
    telephone: v(val.telephone) ? (telValide(val.telephone) ? formatTel(val.telephone) : val.telephone) : null,
    email: v(val.email) ? val.email.toLowerCase() : null,
  };
  try {
    const c = await DB.creerClient(row);
    await chargerDonnees();
    if (S.pickPour === 'fa') { fermerModale(); await creerFactureLibre(c.id); return; }
    (S.pickPour === 'pr' ? S.pr : S.dv).client_id = c.id;
    fermerModale();
    renderVue();
    toast('Client créé');
  } catch (err) { toast(messageErreur(err), 'erreur'); }
}

function lireLogo(fichier) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(fichier);
    img.onload = () => {
      const r = Math.min(1, 600 / img.width, 300 / img.height);
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * r)); cv.height = Math.max(1, Math.round(img.height * r));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible : utilise un fichier PNG ou JPG.')); };
    img.src = url;
  });
}

const ROLES = [

];
const ROLES_HORAIRES = ROLES.filter((r) => !r.sansHoraire);
