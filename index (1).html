};
const JOURS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const ONGLETS = ['accueil', 'clients', 'devis', 'planning'];

const associeParId = (id) => S.associes.find((a) => a.id === id) || null;
const idAssocieDe = (email) => S.associes.find((a) => v(a.email) && a.email.toLowerCase() === String(email || '').toLowerCase())?.id || null;
function titrePrestation(p) {
  const c = p.client_id ? S.clients.find((x) => x.id === p.client_id) : null;
  return c ? nomAffiche(c) : (v(p.titre) ? p.titre : 'Prestation');
}

const frDate = (iso) => (v(iso) ? String(iso).split('-').reverse().join('/') : '');
const ciblePrestation = (p) => [frDate(p.date_evenement), p.client_id ? nomClient(p.client_id) : p.titre].filter(v).join(' – ');

/* ---------- Dates et créneaux ---------- */
const aMinutes = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
function moment(iso, t) { const d = versDate(iso); d.setHours(0, 0, 0, 0); if (v(t)) d.setMinutes(aMinutes(t)); return d; }
function lendemain(d) { const x = new Date(d); x.setDate(x.getDate() + 1); return x; }
const hDe = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const joursJusqua = (iso) => Math.round((debutJour(versDate(iso)) - debutJour(new Date())) / 864e5);
const chevauche = (a, b) => !!(a && b && a.debut < b.fin && b.debut < a.fin);

function fenetre(iso, heure, dureeMin) {
  if (!v(iso)) return null;
  const debut = moment(iso, heure);
  if (!v(heure)) return { debut, fin: lendemain(debut), flou: true };
  return { debut, fin: new Date(debut.getTime() + dureeMin * 6e4), flou: false };
}
function fenetreEvenement(p) {
  if (!v(p.date_evenement)) return null;
  if (!v(p.heure_debut)) return fenetre(p.date_evenement, null);
  const debut = moment(p.date_evenement, p.heure_debut);
  let fin;
  if (v(p.heure_fin)) { fin = moment(p.date_evenement, p.heure_fin); if (fin <= debut) fin = lendemain(fin); }
  else fin = new Date(debut.getTime() + 5 * 36e5);
  return { debut, fin, flou: !v(p.heure_fin) };
}
function fenetresRoles(p) {
  return {
    livraison: fenetre(p.livraison_date || p.date_evenement, p.livraison_heure, 90),
    presence: fenetreEvenement(p),
    recuperation: fenetre(p.recuperation_date, p.recuperation_heure, 60),
  };
}
function occupationBorne(p) {
  const ev = fenetreEvenement(p);
  if (!ev) return null;
  const f = fenetresRoles(p);
  const debut = f.livraison && f.livraison.debut < ev.debut ? f.livraison.debut : ev.debut;
  const fin = f.recuperation && f.recuperation.fin > ev.fin ? f.recuperation.fin : ev.fin;
  return { debut, fin };
}
function concurrenceMax(liste) {
  const pts = liste.flatMap((x) => [[x.debut.getTime(), 1], [x.fin.getTime(), -1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  let n = 0, max = 0;
  for (const [, d] of pts) { n += d; max = Math.max(max, n); }
  return max;
}
function calculerLivraison(dateIso, heureDebut) {
  if (!v(dateIso)) return { date: null, heure: null };
  if (!v(heureDebut)) return { date: dateIso, heure: null };
  const d = moment(dateIso, heureDebut);
  d.setMinutes(d.getMinutes() - Math.round(num(param('planning').delai_installation_h) * 60));
  return { date: isoDe(d), heure: hDe(d) };
}

/* ---------- Indisponibilités ---------- */
function libelleIndispo(i) {
  const h = v(i.heure_debut) ? `, ${hhmm(i.heure_debut)}${v(i.heure_fin) ? '–' + hhmm(i.heure_fin) : ''}` : '';
  if (i.recurrence === 'hebdo') return `Chaque ${JOURS[Number(i.jour_semaine) - 1]}${h || ', toute la journée'}`;
  if (i.date_debut === i.date_fin) return cap(dateLongue(i.date_debut, true)) + h;
  return `Du ${dateCourte(i.date_debut)} au ${dateCourte(i.date_fin)}${h}`;
}
function creneauIndispo(i, iso) {
  const jour = versDate(iso), concerne = i.recurrence === 'hebdo'
    ? ((jour.getDay() + 6) % 7) + 1 === Number(i.jour_semaine)
    : iso >= i.date_debut && iso <= i.date_fin;
  if (!concerne) return null;
  if (!v(i.heure_debut)) { const d = moment(iso); return { debut: d, fin: lendemain(d) }; }
  const w = { debut: moment(iso, i.heure_debut), fin: v(i.heure_fin) ? moment(iso, i.heure_fin) : lendemain(moment(iso)) };
  if (w.fin <= w.debut) w.fin = lendemain(w.fin);
  return w;
}
function indispoPendant(associeId, f) {
  if (!associeId || !f) return null;
  for (const i of S.indispos.filter((x) => x.associe_id === associeId)) {
    for (let d = debutJour(f.debut); d < f.fin; d = lendemain(d)) {
      if (chevauche(creneauIndispo(i, isoDe(d)), f)) return i;
    }
  }
  return null;
}
const indisposDuJour = (iso) => S.indispos.filter((i) => creneauIndispo(i, iso));

/* ---------- Alertes d'une prestation ---------- */
function alertesPrestation(p, toutes = S.prestations) {
  const r = [];
  if (p.statut !== 'a_venir') return r;
  const cfg = param('planning');
  const autres = toutes.filter((x) => x.id !== p.id && x.statut === 'a_venir');
  const prenom = (id) => associeParId(id)?.prenom || 'Quelqu’un';
  if (!v(p.date_evenement)) r.push({ niveau: 'rouge', texte: 'Date de l’événement manquante' });
  const j = v(p.date_evenement) ? joursJusqua(p.date_evenement) : null;

  // Borne déjà prise
  const occ = occupationBorne(p);
  if (occ) {
    const conflits = autres.filter((o) => chevauche(occ, occupationBorne(o)));
    if (conflits.length) {
      const coupe = (o) => { const x = occupationBorne(o); return { debut: x.debut < occ.debut ? occ.debut : x.debut, fin: x.fin > occ.fin ? occ.fin : x.fin }; };
      if (concurrenceMax([occ, ...conflits.map(coupe)]) > (Number(cfg.nb_bornes) || 1)) {
        r.push({ niveau: 'rouge', texte: `Borne déjà prise : ${conflits.map(titrePrestation).join(', ')}`, lien: conflits[0].id });
      }
    }
  }
  // Rôles à attribuer
  for (const role of ROLES.filter((x) => x.requis)) {
    if (p[role.col]) continue;
    const urgent = !role.sansHoraire && j != null && j <= (Number(cfg.alerte_roles_jours) || 7);
    r.push({ niveau: urgent ? 'rouge' : 'orange', texte: `${role.libelle} : personne n’est prévu`, role: role.cle });
  }
  const f = fenetresRoles(p);
  for (const role of ROLES_HORAIRES) {
    const id = p[role.col];
    if (!id || !f[role.cle]) continue;
    // Indisponible
    const ind = indispoPendant(id, f[role.cle]);
    if (ind) r.push({ niveau: 'orange', texte: `${prenom(id)} est indisponible (${ind.motif || libelleIndispo(ind)}) : ${role.libelle.toLowerCase()}`, role: role.cle });
    // À deux endroits en même temps
    for (const o of autres) {
      const fo = fenetresRoles(o);
      for (const r2 of ROLES_HORAIRES) {
        if (o[r2.col] !== id || !chevauche(f[role.cle], fo[r2.cle])) continue;
        const flou = f[role.cle].flou || fo[r2.cle].flou;
        r.push({ niveau: flou ? 'orange' : 'rouge', texte: `${prenom(id)} a déjà une mission au même moment : ${r2.court.toLowerCase()} pour ${titrePrestation(o)}${flou ? ' (horaires à préciser)' : ''}`, lien: o.id });
      }
    }
  }
  // Infos manquantes
  if (v(p.date_evenement) && !v(p.heure_debut)) r.push({ niveau: 'orange', texte: 'Heure de début manquante' });
  if (!v(p.lieu_adresse) || !v(p.lieu_ville)) r.push({ niveau: 'orange', texte: 'Adresse du lieu incomplète' });
  if (!v(p.contact_nom) && !v(p.contact_tel)) r.push({ niveau: 'orange', texte: 'Pas de contact pour le jour J' });
  if (!v(p.livraison_heure)) r.push({ niveau: 'orange', texte: 'Heure de livraison à fixer' });
  if (!v(p.recuperation_date) || !v(p.recuperation_heure)) r.push({ niveau: 'orange', texte: 'Récupération : date ou heure à fixer' });
  const fin = p.recuperation_date || p.date_evenement;
  if (v(fin) && fin < aujourdhui()) r.push({ niveau: 'orange', texte: 'Prestation passée : à marquer comme réalisée' });
  return r.sort((a, b) => (a.niveau === 'rouge' ? 0 : 1) - (b.niveau === 'rouge' ? 0 : 1));
}
function calculerPlanning() {
  S.prAlertes = new Map(S.prestations.map((p) => [p.id, alertesPrestation(p)]));
}
const niveauPr = (id) => {
  const a = S.prAlertes.get(id) || [];
  return a.some((x) => x.niveau === 'rouge') ? 'rouge' : a.length ? 'orange' : 'ok';
};
const nbPrestationsRouge = () => S.prestations.filter((p) => niveauPr(p.id) === 'rouge').length;

/* ---------- Missions (livraison, événement, récupération) ---------- */
function missionsDe(p) {
  const out = [];
  if (v(p.livraison_date || p.date_evenement)) out.push({ type: 'livraison', date: p.livraison_date || p.date_evenement, heure: p.livraison_heure, personne: p.role_livraison, p });
  if (v(p.date_evenement)) out.push({ type: 'evenement', date: p.date_evenement, heure: p.heure_debut, fin: p.heure_fin, personne: p.role_presence, p });
  if (v(p.recuperation_date)) out.push({ type: 'recuperation', date: p.recuperation_date, heure: p.recuperation_heure, personne: p.role_recuperation, p });
  return out;
}
const triMissions = (a, b) => String(a.date).localeCompare(String(b.date)) || String(a.heure || '').localeCompare(String(b.heure || ''));
function mesMissions() {
  const moi = S.moi?.id;
  if (!moi) return [];
  return S.prestations.filter((p) => p.statut === 'a_venir').flatMap(missionsDe)
    .filter((m) => m.personne === moi && m.date >= aujourdhui()).sort(triMissions);
}
const libelleMission = (m) => (m.type === 'evenement' ? (m.personne && m.personne === S.moi?.id ? 'Sur place' : 'Événement') : TYPES_MISSION[m.type].libelle);
function chipPersonne(id, role) {

  if (a) return `<span class="pers" style="--c:${esc(a.couleur)}"><span class="pastille"></span>${esc(a.prenom)}</span>`;

}

function libellePeriode() {

  const fin = isoDe(ajouterJours(S.plDebut, 27));

    .filter((p) => (S.plAnnulees || p.statut !== 'annulee') && (S.plFiltre !== 'alertes' || (S.prAlertes.get(p.id) || []).length))

    };
    const points = liste.map((m) => `<i style="--c:${m.type === 'evenement' ? (niveauPr(m.p.id) === 'rouge' ? 'var(--rouge)' : 'var(--flash-2)') : m.type === 'livraison' ? '#0369A1' : '#7C3AED'}"></i>`).join('');
    const ind = indisposDuJour(iso).map((x) => `<i style="--c:${esc(associeParId(x.associe_id)?.couleur || '#999')}" title="${esc((associeParId(x.associe_id)?.prenom || '') + ' indisponible')}"></i>`).join('');
    cases.push(`<div class="cal-jour ${d.getMonth() !== mo - 1 ? 'hors' : ''} ${iso === auj ? 'auj' : ''} ${iso === S.plJour ? 'sel' : ''}" data-action="pl-jour" data-date="${iso}" role="button" tabindex="0" aria-label="${esc(dateLongue(iso, true))}">
      <span class="cal-num">${d.getDate()}</span>

      <span class="cal-indispo">${ind}</span>
    </div>`);
  }

const rafraichirIndispo = () => { const m = $('#modale .modale'); if (m) m.innerHTML = formIndispoHtml(); };
async function enregistrerIndispo() {
  const x = S.indispoEdit;
  if (!x.associe_id) { toast('Choisis la personne concernée.', 'erreur'); return; }
  if (x.recurrence === 'aucune') {
    if (!v(x.date_debut) || !v(x.date_fin)) { toast('Indique les dates de début et de fin.', 'erreur'); return; }
    if (x.date_fin < x.date_debut) { toast('La date de fin est avant la date de début.', 'erreur'); return; }
  }
  const row = {
    associe_id: x.associe_id, recurrence: x.recurrence,
    date_debut: x.recurrence === 'aucune' ? x.date_debut : null, date_fin: x.recurrence === 'aucune' ? x.date_fin : null,
    jour_semaine: x.recurrence === 'hebdo' ? Number(x.jour_semaine) : null,
    heure_debut: v(x.heure_debut) ? x.heure_debut : null, heure_fin: v(x.heure_debut) && v(x.heure_fin) ? x.heure_fin : null,
    motif: v(x.motif) ? x.motif.trim() : null,
  };
  try {
    if (x.id) await DB.majIndispo(x.id, row); else await DB.creerIndispo(row);
    fermerModale();
    await chargerDonnees();
    renderVue();
    toast('Indisponibilité enregistrée');
  } catch (err) { toast(messageErreur(err), 'erreur'); }
}
async function supprimerIndispo() {
  const x = S.indispoEdit;
  fermerModale();
  if (!(await confirmer({ titre: 'Supprimer cette indisponibilité ?', texte: libelleIndispo(x), ok: 'Supprimer', danger: true }))) return;
  try { await DB.supprimerIndispo(x.id); await chargerDonnees(); renderVue(); toast('Indisponibilité supprimée'); }
  catch (err) { toast(messageErreur(err), 'erreur'); }
}

/* ---------- Fiche prestation : conversion ---------- */
function editablePr(x) {
  const e = {};
  for (const [k, val] of Object.entries(x)) e[k] = val == null ? '' : val;
  for (const k of ['heure_debut', 'heure_fin', 'livraison_heure', 'recuperation_heure']) e[k] = hhmmSaisie(x[k]);
  e.nb_invites = x.nb_invites == null || x.nb_invites === '' ? '' : String(x.nb_invites);
  e.nb_tirages = x.nb_tirages == null || x.nb_tirages === '' ? '' : String(x.nb_tirages);
  e.montant = fmtNombre(x.montant || 0);
  return e;
}
function donneesPrestation(x) {
  const nn = (y) => (v(y) ? String(y).trim() : null);
  const t = (h) => (v(h) ? String(h).slice(0, 5) : null);
  return {
    client_id: x.client_id || null, titre: nn(x.titre), evenement_type: nn(x.evenement_type),
    date_evenement: nn(x.date_evenement), heure_debut: t(x.heure_debut), heure_fin: t(x.heure_fin),
    lieu_nom: nn(x.lieu_nom), lieu_adresse: nn(x.lieu_adresse), lieu_cp: nn(x.lieu_cp), lieu_ville: nn(x.lieu_ville),
    nb_invites: v(x.nb_invites) ? Math.round(num(x.nb_invites)) : null,
    nb_tirages: v(x.nb_tirages) ? Math.max(0, Math.round(num(x.nb_tirages))) : null,
    contact_nom: nn(x.contact_nom), contact_tel: nn(x.contact_tel),
    livraison_date: nn(x.livraison_date), livraison_heure: t(x.livraison_heure),
    recuperation_date: nn(x.recuperation_date), recuperation_heure: t(x.recuperation_heure),
    role_livraison: x.role_livraison || null, role_presence: x.role_presence || null,
    role_recuperation: x.role_recuperation || null, role_prospection: x.role_prospection || null,
    montant: num(x.montant), notes: nn(x.notes),
  };
}
const prestationModifiee = () => !!S.pr && JSON.stringify(donneesPrestation(S.pr)) !== JSON.stringify(donneesPrestation(S.prBase));
const brouillonPr = () => ({ ...donneesPrestation(S.pr), id: S.pr.id || '__nouvelle', statut: S.prOrig?.statut || 'a_venir', devis_id: S.pr.devis_id || null });

function ouvrirEditeurPrestation(id, p = {}) {
  if (id === 'nouveau') {
    const date = v(p.date) ? p.date : '';
    S.prOrig = null;
    S.pr = editablePr({
      id: null, statut: 'a_venir', devis_id: null, client_id: p.client || null,
      date_evenement: date, livraison_date: date, recuperation_date: date ? isoDe(ajouterJours(date, 1)) : '',
      role_prospection: S.moi?.id || null, montant: 0,
    });
  } else {
    const x = S.prestations.find((y) => y.id === id);
    if (!x) {
      toast('Cette prestation n’existe plus.', 'erreur');
      history.replaceState(null, '', '#planning');
      S.pr = null; S.prId = null;
      return;
    }
    S.prOrig = clone(x);
    S.pr = editablePr(x);
  }
  S.prBase = clone(S.pr);
  S.prId = id;
}

/* ---------- Fiche prestation : enregistrement ---------- */
async function enregistrerPrestation(extra = {}, message = 'Prestation enregistrée') {
  if (S.enCours) return false;
  const row = donneesPrestation(S.pr);
  if (!row.client_id && !v(row.titre)) { toast('Choisis un client ou indique un intitulé.', 'erreur'); return false; }
  S.enCours = true;
  try {
    if (!S.pr.id) {
      const cree = await DB.creerPrestation({ ...row, statut: 'a_venir', ...extra });
      await chargerDonnees();
      history.replaceState(null, '', construireHash('planning', { id: cree.id }));
      ouvrirEditeurPrestation(cree.id);
      toast('Prestation créée');
    } else {
      const base = donneesPrestation(S.prBase), patch = {};
      for (const [k, val] of Object.entries(row)) if (JSON.stringify(val) !== JSON.stringify(base[k])) patch[k] = val;
      Object.assign(patch, extra);
      if (Object.keys(patch).length) await DB.majPrestation(S.prOrig.id, patch);
      await chargerDonnees();
      ouvrirEditeurPrestation(S.prOrig.id);
      toast(Object.keys(patch).length ? message : 'Aucune modification');
    }
    renderVue();
    return true;
  } catch (err) {
    toast(messageErreur(err), 'erreur');
    return false;
  } finally {
    S.enCours = false;
  }
}
async function changerStatutPrestation(statut) {
  if (statut === 'annulee') {
    const lie = !!S.prOrig.devis_id;
    if (!(await confirmer({ titre: 'Annuler cette prestation ?', texte: `Elle sera retirée du planning actif.${lie ? ' Le devis reste « Accepté » : pense à prévenir le client.' : ''} Tu pourras la remettre à venir.`, ok: 'Annuler la prestation', danger: true }))) return;
  }
  const msg = { realisee: 'Prestation marquée comme réalisée', annulee: 'Prestation annulée', a_venir: 'Prestation remise à venir' }[statut];
  await enregistrerPrestation({ statut }, msg);
}

  if (!(await confirmer({ titre: 'Supprimer cette prestation ?', texte: `${titrePrestation(S.prOrig)} sera supprimée définitivement. L’action reste tracée dans le journal.`, ok: 'Supprimer', danger: true }))) return;

function texteIcs(evts) {
  const e = (t) => String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const utc = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const jour = (d) => isoDe(d).replace(/-/g, '');
  const enc = new TextEncoder();
  const plier = (l) => {
    if (enc.encode(l).length <= 75) return l;
    const out = []; let cur = '', n = 0;
    for (const ch of l) {
      const t = enc.encode(ch).length;
      if (n + t > (out.length ? 74 : 75)) { out.push(cur); cur = ''; n = 0; }
      cur += ch; n += t;
    }
    out.push(cur);
    return out.join('\r\n ');
  };
  const l = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//FlashBox//CRM//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  for (const x of evts) {
    l.push('BEGIN:VEVENT', `UID:${x.uid}`, `DTSTAMP:${utc(new Date())}`);
    if (x.journee) l.push(`DTSTART;VALUE=DATE:${jour(x.debut)}`, `DTEND;VALUE=DATE:${jour(lendemain(x.debut))}`);
    else l.push(`DTSTART:${utc(x.debut)}`, `DTEND:${utc(x.fin)}`);
    l.push(`SUMMARY:${e(x.titre)}`);
    if (x.lieu) l.push(`LOCATION:${e(x.lieu)}`);
    if (x.infos) l.push(`DESCRIPTION:${e(x.infos)}`);
    l.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(x.titre)}`, 'TRIGGER:-P1D', 'END:VALARM');
    if (!x.journee) l.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(x.titre)}`, 'TRIGGER:-PT2H', 'END:VALARM');
    l.push('END:VEVENT');
  }
  l.push('END:VCALENDAR');
  return l.map(plier).join('\r\n') + '\r\n';
}
function lienGoogle(x) {
  const f = x.journee ? (d) => isoDe(d).replace(/-/g, '') : (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const dates = x.journee ? `${f(x.debut)}/${f(lendemain(x.debut))}` : `${f(x.debut)}/${f(x.fin)}`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(x.titre)}&dates=${dates}&location=${encodeURIComponent(x.lieu || '')}&details=${encodeURIComponent(x.infos || '')}`;
}
function telechargerIcs(evts, nom) {
  const url = URL.createObjectURL(new Blob([texteIcs(evts)], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = nom.replace(/[\\/:*?"<>|]/g, '') + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

const TYPES_FACTURE = {
  acompte: { libelle: 'Facture d’acompte', court: 'Acompte' },

const pastilleFa = (s) => `<span class="statut" style="--c:${ETATS_FA[s]?.c};--bg:${ETATS_FA[s]?.bg}">${ETATS_FA[s]?.libelle || s}</span>`;

  { id: 'en_retard', libelle: 'En retard', c: 'var(--rouge)' },

  { id: 'payee', libelle: 'Payées', c: 'var(--vert)' },
];
const moyensPaiement = () => String(param('facturation').moyens || '').split(',').map((x) => x.trim()).filter(Boolean);

/* ---------- Calculs ---------- */
function calculerFacture(f) {
  const lignes = (f.lignes || []).map((l) => ({ ...l, montant: Math.round(num(l.quantite) * cts(l.prix_unitaire)) }));
  const total = lignes.reduce((s, l) => s + l.montant, 0);
  const deduction = f.type === 'avoir' ? 0 : cts(f.deduction);
  return { lignes, total, deduction, net: total - deduction };
}
const paiementsDe = (id) => S.paiements.filter((p) => p.facture_id === id).sort((a, b) => String(a.date_paiement).localeCompare(String(b.date_paiement)));
const encaisseCts = (f) => paiementsDe(f.id).reduce((s, p) => s + cts(p.montant), 0);
const avoirsDe = (f) => S.factures.filter((a) => a.type === 'avoir' && a.statut === 'emise' && a.facture_origine_id === f.id);
const avoirsCts = (f) => avoirsDe(f).reduce((s, a) => s + cts(a.net), 0);
const resteCts = (f) => cts(f.net) - encaisseCts(f) - avoirsCts(f);
function etatFacture(f) {
  if (f.statut === 'brouillon') return 'brouillon';
  if (f.type === 'avoir') return 'avoir';
  const r = resteCts(f), enc = encaisseCts(f);
  if (avoirsCts(f) >= cts(f.net) && enc <= 0) return 'annulee';
  if (r < 0) return 'trop_percu';
  if (r === 0) return 'payee';
  if (v(f.date_echeance) && f.date_echeance < aujourdhui()) return 'en_retard';
  return enc > 0 ? 'partielle' : 'a_payer';
}
function factureARelancer(f) {
  if (etatFacture(f) !== 'en_retard') return false;
  return !f.date_relance || joursDepuis(f.date_relance) >= (Number(param('facturation').relance_jours) || 7);
}
function passeFiltreFa(f, filtre) {
  const e = etatFacture(f);
  if (filtre === 'a_encaisser') return ['a_payer', 'partielle', 'en_retard'].includes(e);
  if (filtre === 'en_retard') return e === 'en_retard';
  if (filtre === 'brouillon') return e === 'brouillon';
  if (filtre === 'payee') return e === 'payee';
  if (filtre === 'avoir') return f.type === 'avoir';
  return true;
}
const facturesEmises = () => S.factures.filter((f) => f.statut === 'emise' && f.type !== 'avoir');
const nbFacturesRetard = () => facturesEmises().filter((f) => etatFacture(f) === 'en_retard').length;
function encaisseAnnee(annee = new Date().getFullYear()) {
  return S.paiements.filter((p) => String(p.date_paiement).startsWith(String(annee)))
    .reduce((s, p) => s + (S.factures.find((f) => f.id === p.facture_id)?.type === 'avoir' ? -1 : 1) * cts(p.montant), 0);
}
const refFacture = (f) => f.reference || 'Brouillon';
const libelleFacture = (f) => `${TYPES_FACTURE[f.type]?.libelle || 'Facture'} ${f.reference || '(brouillon)'}`;
const cibleFacture = (f) => [refFacture(f), nomClient(f.client_id)].filter(Boolean).join(' – ');
const ciblePaiement = (p) => `${eur(cts(p.montant)).replace(/\u00a0/g, ' ')} – ${S.factures.find((f) => f.id === p.facture_id)?.reference || ''}`.replace(/ – $/, '');

/* ---------- Situation d'une prestation ---------- */
function situationPrestation(p) {
  const toutes = S.factures.filter((f) => f.prestation_id === p.id);
  const emises = toutes.filter((f) => f.statut === 'emise' && f.type !== 'avoir' && etatFacture(f) !== 'annulee');
  const facture = emises.reduce((s, f) => s + cts(f.net) - avoirsCts(f), 0);
  const encaisse = emises.reduce((s, f) => s + encaisseCts(f), 0);
  const montant = cts(p.montant);
  return {
    toutes, emises, montant, facture, encaisse,
    resteAFacturer: montant - facture, resteAEncaisser: facture - encaisse,
    acompte: emises.find((f) => f.type === 'acompte') || null,
    finale: emises.find((f) => f.type === 'solde' || f.type === 'totale') || null,
    brouillon: toutes.find((f) => f.statut === 'brouillon') || null,
  };
}
function prestationsAFacturer() {
  return S.prestations.filter((p) => p.client_id && p.statut !== 'annulee' && cts(p.montant) > 0).map((p) => {
    const s = situationPrestation(p), d = p.devis_id ? S.devis.find((x) => x.id === p.devis_id) : null;
    if (s.brouillon || s.resteAFacturer <= 0) return null;
    const passee = p.statut === 'realisee' || (v(p.date_evenement) && p.date_evenement < aujourdhui());
    if (passee) return { p, quoi: s.acompte ? 'Solde à facturer' : 'À facturer', montant: s.resteAFacturer };
    if (d && num(d.acompte_pct) > 0 && !s.emises.length) return { p, quoi: 'Acompte à facturer', montant: calculerDevis(d).acompte };
    return null;
  }).filter(Boolean).sort((a, b) => String(a.p.date_evenement).localeCompare(String(b.p.date_evenement)));
}

/* ---------- Création ---------- */
function echeanceDans(jours) { return isoDe(ajouterJours(aujourdhui(), Number(jours) || 0)); }
function lignesDevisVersFacture(d) {
  const k = calculerDevis(d);
  const lignes = (d.lignes || []).map((l) => ({ libelle: l.libelle || '', description: l.description || '', quantite: num(l.quantite), prix_unitaire: num(l.prix_unitaire) }));
  if (k.remise) lignes.push({ libelle: d.remise_type === '%' ? `Remise ${fmtNombre(d.remise_valeur)} %` : 'Remise', description: '', quantite: 1, prix_unitaire: -k.remise / 100 });
  return lignes;
}
function totauxRow(row) {
  const k = calculerFacture(row);
  return { ...row, total: k.total / 100, deduction: k.deduction / 100, net: k.net / 100 };
}
async function creerFactureDepuisPrestation(p, type) {
  if (!p.client_id) { toast('Choisis d’abord un client pour cette prestation.', 'erreur'); return; }
  const cfg = param('facturation'), d = p.devis_id ? S.devis.find((x) => x.id === p.devis_id) : null, s = situationPrestation(p);
  const evt = [p.evenement_type || 'Événement', v(p.date_evenement) ? 'du ' + dateLongue(p.date_evenement) : ''].filter(Boolean).join(' ');
  let lignes, deductions = [], deduction = 0, echeance;
  if (type === 'acompte') {
    const k = calculerDevis(d);
    lignes = [{ libelle: `Acompte de ${fmtNombre(d.acompte_pct)} % sur le devis ${d.reference}`, description: `${evt}. Montant total du devis : ${eur(k.total)}.`, quantite: 1, prix_unitaire: k.acompte / 100 }];
    echeance = echeanceDans(cfg.echeance_acompte_jours);
  } else {
    lignes = d ? lignesDevisVersFacture(d) : [{ libelle: `Animation photobooth – ${titrePrestation(p)}`, description: evt, quantite: 1, prix_unitaire: num(p.montant) }];
    if (type === 'solde' && s.acompte) {
      deductions = s.emises.filter((f) => f.type === 'acompte').map((f) => ({ facture_id: f.id, reference: f.reference, montant: (cts(f.net) - avoirsCts(f)) / 100 }));
      deduction = deductions.reduce((x, y) => x + y.montant, 0);
    }
    const avant = v(p.date_evenement) ? isoDe(ajouterJours(p.date_evenement, -(Number(cfg.echeance_solde_jours_avant) || 0))) : null;
    echeance = avant && avant > aujourdhui() ? avant : echeanceDans(cfg.delai_paiement_jours);
  }
  const row = totauxRow({
    type, statut: 'brouillon', client_id: p.client_id, prestation_id: p.id, devis_id: d?.id || null, facture_origine_id: null,
    date_echeance: echeance, objet: `${TYPES_FACTURE[type].libelle} – ${titrePrestation(p)}${v(p.date_evenement) ? ' (' + dateCourte(p.date_evenement) + ')' : ''}`,
    lignes, deductions, deduction, conditions: cfg.conditions || null, notes_internes: null,
  });
  try {
    const f = await DB.creerFacture(row);
    await chargerDonnees();
    S.edSortieOk = true;
    location.hash = construireHash('factures', { id: f.id });
    toast('Brouillon de facture créé : vérifie-le puis émets-le');
  } catch (err) { toast(messageErreur(err), 'erreur'); }
}
async function creerFactureLibre(clientId) {
  const row = totauxRow({
    type: 'totale', statut: 'brouillon', client_id: clientId, prestation_id: null, devis_id: null, facture_origine_id: null,
    date_echeance: echeanceDans(param('facturation').delai_paiement_jours), objet: 'Facture',
    lignes: [{ libelle: '', description: '', quantite: 1, prix_unitaire: 0 }], deductions: [], deduction: 0,

async function creerAvoir(f) {
  const dispo = cts(f.net) - avoirsCts(f);
  if (dispo <= 0) { toast('Cette facture est déjà entièrement annulée par avoir.', 'erreur'); return; }
  if (!(await confirmer({ titre: 'Créer un avoir ?', texte: `Un avoir annule tout ou partie de ${f.reference}. Le brouillon reprend le montant restant (${eur(dispo)}) : tu pourras l’ajuster avant de l’émettre.`, ok: 'Créer l’avoir' }))) return;
  const row = totauxRow({

    date_echeance: null, objet: `Avoir sur la facture ${f.reference}`,
    lignes: [{ libelle: `Annulation de la facture ${f.reference}`, description: f.objet || '', quantite: 1, prix_unitaire: dispo / 100 }],
    deductions: [], deduction: 0, conditions: null, notes_internes: null,

  try {

/* ---------- Enregistrement, émission, relance, suppression ---------- */
async function enregistrerFacture(extra = {}, message = 'Facture enregistrée') {
  if (S.enCours) return false;
  S.enCours = true;
  try {
    const row = donneesFacture(S.fa), base = donneesFacture(S.faBase), patch = {};
    const champs = Object.keys(row);
    for (const k of champs) if (JSON.stringify(row[k]) !== JSON.stringify(base[k])) patch[k] = row[k];
    Object.assign(patch, extra);
    if (Object.keys(patch).length) await DB.majFacture(S.faOrig.id, patch);
    await chargerDonnees();
    ouvrirEditeurFacture(S.faOrig.id);
    renderVue();
    if (message) toast(Object.keys(patch).length ? message : 'Aucune modification');
    return true;
  } catch (err) { toast(messageErreur(err), 'erreur'); return false; }
  finally { S.enCours = false; }
}
async function emettreFacture() {
  const al = alertesFacture(S.fa), bloquants = al.filter((a) => a.niveau === 'rouge');
  if (bloquants.length) { toast(bloquants.map((a) => a.texte).join(' ; '), 'erreur'); return; }
  const avertir = al;
  const texte = `Elle recevra son numéro définitif. Tu pourras encore la modifier ou la supprimer ensuite.${avertir.length ? ' Attention : ' + avertir.map((a) => a.texte.toLowerCase()).join(' ; ') + '.' : ''}`;
  if (!(await confirmer({ titre: S.faOrig.type === 'avoir' ? 'Émettre cet avoir ?' : 'Émettre cette facture ?', texte, ok: 'Émettre', danger: avertir.length > 0 }))) return;
  const c = clientFacture(S.faOrig);
  if (await enregistrerFacture({ statut: 'emise', date_facture: aujourdhui(), client_snapshot: c }, '')) {
    toast(`${TYPES_FACTURE[S.faOrig.type].libelle} ${S.faOrig.reference} émise`);
    await pdfFacture();
  }
}
async function relancerFacture() {
  await enregistrerFacture({ date_relance: aujourdhui() }, 'Relance notée');
}
async function supprimerFacture() {
  const o = S.faOrig, emise = o.statut === 'emise';
  if (S.paiements.some((p) => p.facture_id === o.id)) { toast('Supprime d’abord les paiements enregistrés sur cette facture.', 'erreur'); return; }
  if (!(await confirmer(emise

/* ---------- Stock calculé ---------- */
const tiragesPrestation = (p) => (v(p.nb_tirages) ? Number(p.nb_tirages) : Number(param('materiel').tirages_moyens) || 0);
const lignesCmd = (statut, cid) => S.commandes.filter((c) => c.statut === statut)
  .flatMap((c) => (c.lignes || []).filter((l) => l.type === 'consommable' && l.consommable_id === cid).map((l) => ({ ...l, cmd: c })));
function stockConso(c) {
  const debut = String(c.created_at || '').slice(0, 10);
  const mouv = S.mouvements.filter((m) => m.consommable_id === c.id).reduce((s, m) => s + num(m.quantite), 0);
  const recu = lignesCmd('recue', c.id).reduce((s, l) => s + num(l.quantite), 0);
  let conso = 0, nbPr = 0;
  if (c.decompte_auto && num(c.tirages_par_unite) > 0) {
    for (const p of S.prestations.filter((x) => x.statut === 'realisee' && v(x.date_evenement) && x.date_evenement >= debut)) {
      conso += tiragesPrestation(p) / num(c.tirages_par_unite); nbPr++;
    }
  }
  return { stock: mouv + recu - conso, conso, nbPr, recu, mouv };
}
function etatStock(c) {
  const { stock } = stockConso(c), tpu = num(c.tirages_par_unite);
  const horizon = Number(param('materiel').horizon_jours) || 30;
  const aVenir = c.decompte_auto && tpu > 0
    ? S.prestations.filter((p) => p.statut === 'a_venir' && v(p.date_evenement) && p.date_evenement >= aujourdhui() && joursJusqua(p.date_evenement) <= horizon)
    : [];
  const besoin = aVenir.reduce((s, p) => s + tiragesPrestation(p) / tpu, 0);
  const enCours = lignesCmd('commandee', c.id);
  const attendu = enCours.reduce((s, l) => s + num(l.quantite), 0);
  const seuil = num(c.seuil_alerte), prevision = stock - besoin;
  let niveau = 'ok', texte = '';
  if (!c.actif) return { stock, besoin, prevision, attendu, niveau, texte, aVenir };
  if (stock <= seuil) {
    niveau = attendu > 0 ? 'orange' : 'rouge';
    texte = stock <= 0 ? 'Stock épuisé' : 'Stock bas';
    if (attendu > 0) texte += ` : commande en cours (+${qteTxt(attendu)} ${c.unite})`;
  } else if (prevision <= seuil && prevision + attendu <= seuil) {
    niveau = 'orange';
    texte = `À commander : ${pluriel(aVenir.length, 'prestation', 'prestations')} dans les ${horizon} jours`;
  }
  return { stock, besoin, prevision, attendu, niveau, texte, aVenir };
}
function qteAffichee(c, x) {
  const tpu = num(c.tirages_par_unite);
  if (tpu > 0) return { grand: `${fmtNombre(Math.round(x * tpu))}`, unite: 'tirages', petit: `${qteTxt(x)} ${c.unite}` };
  return { grand: qteTxt(x), unite: c.unite, petit: '' };
}
const coutTirage = (c) => (num(c.tirages_par_unite) > 0 ? num(c.prix_unitaire) / num(c.tirages_par_unite) : 0);
const consoPrincipal = () => S.consommables.find((c) => c.actif && c.decompte_auto) || null;
function alertesMateriel() {
  const r = [];
  for (const c of S.consommables) { const e = etatStock(c); if (e.niveau !== 'ok') r.push({ niveau: e.niveau, texte: `${c.nom} : ${e.texte}` }); }
  for (const m of S.materiel) if (['en_panne', 'a_verifier'].includes(m.etat)) r.push({ niveau: m.etat === 'en_panne' ? 'rouge' : 'orange', texte: `${m.nom} : ${ETATS_MAT[m.etat].libelle.toLowerCase()}` });
  for (const c of S.commandes) if (c.statut === 'commandee' && v(c.date_prevue) && c.date_prevue < aujourdhui()) r.push({ niveau: 'orange', texte: `Commande « ${c.libelle} » : livraison prévue le ${dateCourte(c.date_prevue)} dépassée` });
  return r;
}

/* ---------- Frais avancés ---------- */
function fraisAvances() {
  const tot = new Map();
  const add = (qui, x) => tot.set(qui || '', (tot.get(qui || '') || 0) + cts(x));
  S.depenses.forEach((d) => add(d.paye_par, d.montant));
  S.commandes.filter((c) => c.statut !== 'annulee').forEach((c) => add(c.paye_par, c.montant));
  return tot;
}

function historiqueConso(c) {
  const e = stockConso(c), tpu = num(c.tirages_par_unite);
  const lignes = [
    ...S.mouvements.filter((m) => m.consommable_id === c.id).map((m) => ({ date: m.date_mouvement, lib: m.type === 'ajustement' ? `Correction${v(m.note) ? ' (' + m.note + ')' : ''}` : m.type === 'achat' ? 'Achat' : 'Consommation' + (v(m.note) ? ' (' + m.note + ')' : ''), q: num(m.quantite) })),
    ...lignesCmd('recue', c.id).map((l) => ({ date: l.cmd.date_reception, lib: `Commande reçue : ${l.cmd.libelle}`, q: num(l.quantite) })),
  ];
  if (c.decompte_auto && tpu > 0) {
    const debut = String(c.created_at || '').slice(0, 10);
    for (const p of S.prestations.filter((x) => x.statut === 'realisee' && v(x.date_evenement) && x.date_evenement >= debut)) {
      lignes.push({ date: p.date_evenement, lib: `${titrePrestation(p)} : ${fmtNombre(tiragesPrestation(p))} tirages${v(p.nb_tirages) ? '' : ' (estimés)'}`, q: -tiragesPrestation(p) / tpu });
    }
  }
  lignes.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const aff = (q) => (tpu > 0 ? `${q > 0 ? '+' : '−'}${fmtNombre(Math.abs(Math.round(q * tpu)))} tirages` : `${q > 0 ? '+' : '−'}${qteTxt(Math.abs(q))} ${c.unite}`);
  ouvrirModale(`<h2>Historique : ${esc(c.nom)}</h2>
    <p>Stock actuel : <strong>${esc(qteAffichee(c, e.stock).grand)} ${esc(qteAffichee(c, e.stock).unite)}</strong>${e.nbPr ? `, dont ${pluriel(e.nbPr, 'prestation décomptée', 'prestations décomptées')}` : ''}.</p>
    <div class="historique">${lignes.length ? lignes.map((l) => `<div class="mv-ligne"><span><span class="sec">${esc(dateCourte(l.date))}</span> ${esc(l.lib)}</span><span class="q ${l.q > 0 ? 'plus' : 'moins'}">${aff(l.q)}</span></div>`).join('') : '<p class="sec">Aucun mouvement pour l’instant.</p>'}</div>
    <div class="modale-actions"><button class="btn" data-r="0">Fermer</button></div>`);
  $('#modale .modale').classList.add('large');
}

/* ---------- Enregistrement ---------- */
const TABLES_MT = { conso: 'consommables', mat: 'materiel', dep: 'depenses', cmd: 'commandes' };
function nouveauMt(type, o = {}) {
  if (type === 'conso') return { id: null, nom: '', unite: 'kit', prix_unitaire: '', tirages_par_unite: '', seuil_alerte: '1', decompte_auto: !consoPrincipal(), actif: true, notes: '' };
  if (type === 'mat') return { id: null, nom: '', categorie: '', numero_serie: '', date_achat: '', prix_achat: '', etat: 'ok', notes: '' };
  if (type === 'dep') return { id: null, libelle: '', montant: '', date_depense: aujourdhui(), categorie: '', paye_par: S.moi?.id || null, prestation_id: o.prestation || '', note: '' };
  const c = o.conso ? S.consommables.find((x) => x.id === o.conso) : consoPrincipal();
  return { id: null, libelle: c ? `Réassort ${c.nom}` : '', fournisseur: '', suivi: '', statut: 'commandee', date_commande: aujourdhui(), date_prevue: '', date_reception: '', paye_par: S.moi?.id || null, note: '',
    lignes: c ? [{ type: 'consommable', consommable_id: c.id, libelle: c.nom, quantite: '1', prix_unitaire: fmtNombre(c.prix_unitaire || 0) }] : [{ type: 'autre', consommable_id: null, libelle: '', quantite: '1', prix_unitaire: '0' }] };
}
function editableMt(type, x) {
  const e = clone(x);
  for (const k of Object.keys(e)) if (e[k] == null) e[k] = '';
  if (type === 'conso') { e.prix_unitaire = v(x.prix_unitaire) ? fmtNombre(x.prix_unitaire) : ''; e.seuil_alerte = fmtNombre(x.seuil_alerte); e.decompte_auto = !!x.decompte_auto; e.actif = x.actif !== false; }
  if (type === 'mat') e.prix_achat = v(x.prix_achat) ? fmtNombre(x.prix_achat) : '';
  if (type === 'dep') { e.montant = fmtNombre(x.montant); e.paye_par = x.paye_par || null; }
  if (type === 'cmd') { e.paye_par = x.paye_par || null; e.lignes = (x.lignes || []).map((l) => ({ ...l, quantite: fmtNombre(l.quantite), prix_unitaire: fmtNombre(l.prix_unitaire) })); }
  return e;
}
function donneesMt(type, x) {
  const nn = (y) => (v(y) ? String(y).trim() : null);
  if (type === 'conso') return { nom: String(x.nom || '').trim(), unite: nn(x.unite) || 'kit', prix_unitaire: v(x.prix_unitaire) ? num(x.prix_unitaire) : null, tirages_par_unite: v(x.tirages_par_unite) ? Math.round(num(x.tirages_par_unite)) || null : null, seuil_alerte: num(x.seuil_alerte), decompte_auto: !!x.decompte_auto, actif: x.actif !== false, notes: nn(x.notes) };
  if (type === 'mat') return { nom: String(x.nom || '').trim(), categorie: nn(x.categorie), numero_serie: nn(x.numero_serie), date_achat: nn(x.date_achat), prix_achat: v(x.prix_achat) ? num(x.prix_achat) : null, etat: x.etat || 'ok', notes: nn(x.notes) };
  if (type === 'dep') return { libelle: String(x.libelle || '').trim(), montant: num(x.montant), date_depense: nn(x.date_depense) || aujourdhui(), categorie: nn(x.categorie), paye_par: x.paye_par || null, prestation_id: x.prestation_id || null, note: nn(x.note) };
  const lignes = (x.lignes || []).map((l) => ({ type: l.type, consommable_id: l.type === 'consommable' ? l.consommable_id : null, libelle: l.type === 'consommable' ? (S.consommables.find((c) => c.id === l.consommable_id)?.nom || l.libelle) : String(l.libelle || '').trim(), quantite: num(l.quantite), prix_unitaire: num(l.prix_unitaire) }));
  return { libelle: String(x.libelle || '').trim(), statut: x.statut || 'commandee', fournisseur: nn(x.fournisseur), suivi: nn(x.suivi), date_commande: nn(x.date_commande) || aujourdhui(), date_prevue: nn(x.date_prevue), date_reception: nn(x.date_reception), paye_par: x.paye_par || null, note: nn(x.note), lignes,
    montant: lignes.reduce((s, l) => s + cts(l.quantite * l.prix_unitaire), 0) / 100 };
}
async function enregistrerMt(extra = {}, message = 'Enregistré') {
  const t = S.mtType, x = S.mtEdit;
  if (t === 'corriger') return enregistrerCorrection();
  const row = { ...donneesMt(t, x), ...extra };
  if (t === 'conso' && !row.nom) { toast('Indique le nom du consommable.', 'erreur'); return false; }
  if (t === 'mat' && !row.nom) { toast('Indique le nom du matériel.', 'erreur'); return false; }
  if (t === 'dep' && (!row.libelle || row.montant <= 0)) { toast('Indique un libellé et un montant.', 'erreur'); return false; }
  if (t === 'cmd') {
    if (!row.libelle) { toast('Indique un libellé pour la commande.', 'erreur'); return false; }
    if (row.lignes.some((l) => l.quantite <= 0)) { toast('Chaque ligne doit avoir une quantité.', 'erreur'); return false; }
    if (row.lignes.some((l) => l.type === 'materiel' && !l.libelle)) { toast('Donne un nom au matériel commandé.', 'erreur'); return false; }
  }
  try {
    if (x.id) await DB.modifierMt(TABLES_MT[t], x.id, row); else x.id = (await DB.ajouterMt(TABLES_MT[t], row)).id;
    fermerModale();
    await chargerDonnees();
    renderVue();
    if (message) toast(message);
    return true;
  } catch (err) { toast(messageErreur(err), 'erreur'); return false; }
}
async function enregistrerCorrection() {
  const x = S.mtEdit, c = S.consommables.find((y) => y.id === x.consommable_id), tpu = num(c.tirages_par_unite);
  if (!v(x.reel)) { toast('Indique la quantité réelle.', 'erreur'); return false; }
  const reel = tpu > 0 ? num(x.reel) / tpu : num(x.reel);
  const ecart = Math.round((reel - stockConso(c).stock) * 1000) / 1000;
  if (!ecart) { fermerModale(); toast('Le stock est déjà juste'); return true; }
  try {
    await DB.ajouterMt('mouvements_stock', { consommable_id: c.id, date_mouvement: aujourdhui(), quantite: ecart, type: 'ajustement', note: v(x.note) ? x.note.trim() : 'inventaire' });
    fermerModale(); await chargerDonnees(); renderVue(); toast('Stock corrigé');
    return true;
  } catch (err) { toast(messageErreur(err), 'erreur'); return false; }
}
async function changerStatutCommande(statut) {
  const x = S.mtEdit, mats = (x.lignes || []).filter((l) => l.type === 'materiel');
  if (statut === 'recue') {
    const date = v(x.date_reception) ? x.date_reception : aujourdhui();
    if (!(await enregistrerMt({ statut: 'recue', date_reception: date }, ''))) return;
    // Le matériel durable commandé rejoint l'inventaire
    for (const l of mats) {
      const n = Math.max(1, Math.min(10, Math.round(num(l.quantite))));
      for (let i = 0; i < n; i++) await DB.ajouterMt('materiel', { nom: String(l.libelle).trim(), categorie: null, numero_serie: null, date_achat: date, prix_achat: num(l.prix_unitaire), etat: 'ok', notes: null, commande_id: x.id });
    }
    await chargerDonnees(); renderVue();
    toast(mats.length ? 'Commande reçue : stock et inventaire mis à jour' : 'Commande reçue : stock mis à jour');
    return;
  }
  const etait = S.commandes.find((c) => c.id === x.id)?.statut;
  if (etait === 'recue') {
    const lies = S.materiel.filter((m) => m.commande_id === x.id);
    fermerModale();
    if (!(await confirmer({ titre: 'Annuler la réception ?', texte: `La commande repasse « Commandée » et ne compte plus dans le stock.${lies.length ? ` ${pluriel(lies.length, 'élément ajouté', 'éléments ajoutés')} à l’inventaire à sa réception ${lies.length > 1 ? 'seront retirés' : 'sera retiré'}.` : ''}`, ok: 'Annuler la réception', danger: true }))) return;
    try {
      for (const m of lies) await DB.retirerMt('materiel', m.id);
      await DB.modifierMt('commandes', x.id, { statut: 'commandee', date_reception: null });
      await chargerDonnees(); renderVue(); toast('Réception annulée');
    } catch (err) { toast(messageErreur(err), 'erreur'); }
    return;
  }
  await enregistrerMt({ statut }, statut === 'annulee' ? 'Commande annulée' : 'Commande remise en cours');
}
async function supprimerMt() {
  const t = S.mtType, x = S.mtEdit;
  const nom = { conso: x.nom, mat: x.nom, dep: x.libelle, cmd: x.libelle }[t];
  fermerModale();
  const txt = t === 'cmd' && x.statut === 'recue' ? ' Elle ne comptera plus dans le stock (le matériel déjà ajouté à l’inventaire reste).' : '';
  if (!(await confirmer({ titre: 'Supprimer ?', texte: `« ${nom} » sera supprimé définitivement.${txt} L’action reste tracée dans le journal.`, ok: 'Supprimer', danger: true }))) return;
  try { await DB.retirerMt(TABLES_MT[t], x.id); await chargerDonnees(); renderVue(); toast('Supprimé'); }
  catch (err) { toast(messageErreur(err), 'erreur'); }
}

function cibleMt(table, x) {
  if (table === 'materiel' || table === 'consommables') return x.nom;
  if (table === 'mouvements_stock') { const q = num(x.quantite); return `${S.consommables.find((c) => c.id === x.consommable_id)?.nom || ''} – ${q > 0 ? '+' : ''}${String(q).replace('.', ',')}`; }
  return `${x.libelle} – ${montantTxt(x.montant)}`;
}
const MODULES_MT = { materiel: 'Matériel', consommables: 'Consommables', depenses: 'Dépenses', mouvements_stock: 'Stock', commandes: 'Commandes' };
const CLES_DEMO_MT = { materiel: 'materiel', consommables: 'consommables', depenses: 'depenses', mouvements_stock: 'mouvements', commandes: 'commandes' };

/* =====================================================================
   Répartition des bénéfices et fonds de commerce (lot 6)
   ===================================================================== */
const TYPES_LIGNE = {
  fonds: { libelle: 'Compte FlashBox', c: '#7C3AED' },
  part:  { libelle: 'Parts égales', c: 'var(--vert)' },
  role:  { libelle: 'Selon les rôles', c: '#946200' },
  frais: { libelle: 'Frais remboursés', c: '#0369A1' },   // anciennes répartitions
  prime: { libelle: 'Primes', c: '#946200' },             // anciennes répartitions
};
const TYPES_FONDS = { apport: 'Apport', retrait: 'Retrait', remboursement: 'Remboursement de frais', ajustement: 'Correction' };
const nomBeneficiaire = (id) => (id ? associeParId(id)?.prenom || 'Associé supprimé' : 'Compte FlashBox');
const repartitionDe = (id) => S.repartitions.find((r) => r.prestation_id === id) || null;
const prestationsARepartir = () => S.prestations.filter((p) => p.statut === 'realisee' && !repartitionDe(p.id))
  .sort((a, b) => String(a.date_evenement).localeCompare(String(b.date_evenement)));

/* ---------- Le calcul ---------- */
// Trois tiers : le compte, les parts égales, les rôles tenus sur la prestation
function calculRepartition(p) {
  const cfg = param('repartition');
  const base = cts(p.montant);
  const pct = (x) => Math.round(base * num(x) / 100);
  const enveloppeEgale = pct(cfg.part_egale), enveloppeRoles = pct(cfg.part_roles);

  // 1. Parts égales entre tous les associés
  const parts = [], equipe = S.associes.map((a) => a.id);
  if (enveloppeEgale > 0 && equipe.length) {
    const part = Math.floor(enveloppeEgale / equipe.length), reliquat = enveloppeEgale - part * equipe.length;
    equipe.forEach((id, i) => parts.push({ type: 'part', associe_id: id, libelle: 'Part égale', montant: part + (i < reliquat ? 1 : 0) }));
  }

  // 2. Part des rôles, au prorata des points de chaque rôle tenu
  const tenus = ROLES.map((r) => ({ r, id: p[r.col], points: Math.max(0, num((cfg.points || {})[r.cle])) })).filter((x) => x.id && x.points > 0);
  const totalPoints = tenus.reduce((s, x) => s + x.points, 0);
  const roles = [];
  if (enveloppeRoles > 0 && totalPoints > 0) {
    let reste = enveloppeRoles;
    tenus.forEach((x, i) => {
      const m = i === tenus.length - 1 ? reste : Math.round(enveloppeRoles * x.points / totalPoints);
      reste -= m;
      roles.push({ type: 'role', associe_id: x.id, libelle: `${x.r.libelle} (${fmtNombre(x.points)} pts)`, montant: m });
    });
  }

  // 3. Le compte garde sa part, plus ce qui n'a pas été distribué
  const distribue = parts.reduce((s, l) => s + l.montant, 0) + roles.reduce((s, l) => s + l.montant, 0);
  const fonds = base - distribue;
  const sansRole = enveloppeRoles > 0 && totalPoints === 0;
  const toutes = [{ type: 'fonds', associe_id: null, libelle: `Compte FlashBox (${fmtNombre(cfg.part_compte)} %)${sansRole ? ' + part des rôles, aucun rôle attribué' : ''}`, montant: fonds }, ...parts, ...roles];
  return { base, taux: num(cfg.part_compte), fonds, manque: 0, frais: [], primes: [], parts, roles, tenus, sansRole,
    totalFrais: 0, totalPrimes: roles.reduce((s, l) => s + l.montant, 0), reste: enveloppeEgale, equipe, lignes: toutes, montantFonds: fonds,
    parAssocie: S.associes.map((a) => ({ a, montant: toutes.filter((l) => l.associe_id === a.id).reduce((s, l) => s + l.montant, 0) })) };
}
const lignesRepartition = (r) => (r.lignes || []).map((l) => ({ ...l, montant: cts(l.montant) }));
const montantPourAssocie = (r, id) => lignesRepartition(r).filter((l) => l.associe_id === id).reduce((s, l) => s + l.montant, 0);

/* ---------- Fonds de commerce ---------- */
function fraisARembourser() {
  return [
    ...S.depenses.filter((d) => d.paye_par && !d.rembourse && !d.prestation_id).map((d) => ({ k: 'dep', id: d.id, date: d.date_depense, libelle: d.libelle, qui: d.paye_par, montant: cts(d.montant) })),
    ...S.commandes.filter((c) => c.paye_par && !c.rembourse && c.statut !== 'annulee').map((c) => ({ k: 'cmd', id: c.id, date: c.date_commande, libelle: c.libelle, qui: c.paye_par, montant: cts(c.montant) })),
  ].sort((a, b) => String(a.date).localeCompare(String(b.date)));
}
function mouvementsFonds() {
  const l = [];
  for (const r of S.repartitions) {
    const p = S.prestations.find((x) => x.id === r.prestation_id);
    l.push({ date: r.date_repartition, libelle: `Répartition : ${p ? titrePrestation(p) : 'prestation supprimée'}`, montant: cts(r.montant_fonds), type: 'Répartition', ref: r.prestation_id });
  }
  for (const c of S.commandes.filter((x) => !x.paye_par && x.statut !== 'annulee')) l.push({ date: c.date_commande, libelle: `Commande : ${c.libelle}`, montant: -cts(c.montant), type: 'Commande' });
  for (const d of S.depenses.filter((x) => !x.paye_par)) l.push({ date: d.date_depense, libelle: `Dépense : ${d.libelle}`, montant: -cts(d.montant), type: 'Dépense' });
  for (const m of S.fondsMouvements) l.push({ date: m.date_mouvement, libelle: m.libelle, montant: cts(m.montant), type: TYPES_FONDS[m.type] || 'Mouvement', id: m.id });
  return l.sort((a, b) => String(b.date).localeCompare(String(a.date)));
}
const soldeFonds = () => mouvementsFonds().reduce((s, m) => s + m.montant, 0);
function duAssocie(id) {
  const rep = S.repartitions.filter((r) => r.statut === 'validee').reduce((s, r) => s + montantPourAssocie(r, id), 0);
  const frais = fraisARembourser().filter((f) => f.qui === id).reduce((s, f) => s + f.montant, 0);
  return { rep, frais, total: rep + frais };
}

async function validerRepartition() {
  const p = S.rpEdit.prestation, c = calculRepartition(p);
  const row = {
    prestation_id: p.id, date_repartition: aujourdhui(), statut: 'validee',
    base: c.base / 100, taux_fonds: c.taux, montant_fonds: c.montantFonds / 100,
    total_frais: 0, total_primes: c.totalPrimes / 100, reste: c.reste / 100,
    lignes: c.lignes.map((l) => ({ ...l, montant: l.montant / 100 })), date_reglement: null, note: null,
  };
  try {
    await DB.ajouterRp('repartitions', row);
    fermerModale(); await chargerDonnees(); renderVue();
    toast('Répartition validée');
  } catch (err) { toast(messageErreur(err), 'erreur'); }
}
async function reglerRepartition(annuler) {
  const r = S.rpEdit.r;
  try {
    await DB.modifierRp('repartitions', r.id, annuler ? { statut: 'validee', date_reglement: null } : { statut: 'reglee', date_reglement: aujourdhui() });
    fermerModale(); await chargerDonnees(); renderVue();
    toast(annuler ? 'Règlement annulé' : 'Répartition marquée comme réglée');
  } catch (err) { toast(messageErreur(err), 'erreur'); }
}
async function supprimerRepartition() {
  const r = S.rpEdit.r;
  fermerModale();
  if (!(await confirmer({ titre: 'Annuler cette répartition ?', texte: 'La prestation repassera dans « À répartir » et le fonds sera recalculé. L’action reste tracée dans le journal.', ok: 'Annuler la répartition', danger: true }))) return;
  try { await DB.retirerRp('repartitions', r.id); await chargerDonnees(); renderVue(); toast('Répartition annulée'); }
  catch (err) { toast(messageErreur(err), 'erreur'); }
}

  const x = S.fmEdit;

  if (!(await confirmer({ titre: 'Supprimer ce mouvement ?', texte: `« ${x.libelle} » sera supprimé du fonds.`, ok: 'Supprimer', danger: true }))) return;
  try { await DB.retirerRp('fonds_mouvements', x.id); await chargerDonnees(); renderVue(); toast('Mouvement supprimé'); }
  catch (err) { toast(messageErreur(err), 'erreur'); }
}
async function rembourserFrais(k, id) {
  const f = fraisARembourser().find((x) => x.k === k && x.id === id);
  if (!f) return;
  if (!(await confirmer({ titre: 'Rembourser ce frais ?', texte: `${eur(f.montant)} seront sortis du fonds de commerce et rendus à ${nomBeneficiaire(f.qui)}.`, ok: 'Rembourser' }))) return;
  try {
    await DB.ajouterRp('fonds_mouvements', { date_mouvement: aujourdhui(), libelle: `Remboursement ${nomBeneficiaire(f.qui)} : ${f.libelle}`, montant: -f.montant / 100, type: 'remboursement', associe_id: f.qui, note: null });
    await DB.modifierMt(k === 'dep' ? 'depenses' : 'commandes', id, { rembourse: true });
    await chargerDonnees(); renderVue(); toast('Frais remboursé');
  } catch (err) { toast(messageErreur(err), 'erreur'); }
}

  return `<section class="reglage">

      </div>
      <p class="aide" style="margin:2px 0 0">Total : ${fmtNombre(Math.round(total * 100) / 100)} %${Math.abs(total - 100) > 0.01 ? ` — les ${fmtNombre(Math.round((100 - total) * 100) / 100)} % restants vont au compte FlashBox.` : ''}</p>
      <div class="sous-bloc"><span class="etiquette">Poids de chaque rôle</span>
        <p class="aide" style="margin:0 0 8px">La part des rôles se divise au prorata de ces points, entre les seuls rôles attribués. Exemple : livraison 30 et récupération 20 → 60 % et 40 % de l’enveloppe.</p>
        <div class="grille">${ROLES.map(pt).join('')}</div></div>
    </div>
    ${piedReglage('repartition')}
  </section>`;
}

    case 'ind-supprimer': await supprimerIndispo(); break;
    case 'pr-choisir-client': S.pickPour = 'pr'; modaleChoixClient(); break;
    case 'pr-retirer-client': S.pr.client_id = ''; renderVue(); break;
    case 'pr-type-evt':
      S.pr.evenement_type = S.pr.evenement_type === el.dataset.valeur ? '' : el.dataset.valeur;
      $$('#pr-types .puce').forEach((b) => b.classList.toggle('on', b.dataset.valeur === S.pr.evenement_type));
      majPrestationLive();
      break;
    case 'pr-adresse-client': {
      const c = S.clients.find((x) => x.id === S.pr.client_id);
      if (!c) break;
      Object.assign(S.pr, { lieu_adresse: c.adresse || '', lieu_cp: c.code_postal || '', lieu_ville: c.ville || '' });
      ['lieu_adresse', 'lieu_cp', 'lieu_ville'].forEach((k) => { const i = $('#pr-' + k); if (i) i.value = S.pr[k]; });
      majPrestationLive();
      break;
    }
    case 'pr-recalculer': {
      if (!v(S.pr.date_evenement)) { toast('Indique d’abord la date de l’événement.', 'erreur'); break; }
      const liv = calculerLivraison(S.pr.date_evenement, S.pr.heure_debut);
      Object.assign(S.pr, { livraison_date: liv.date || '', livraison_heure: liv.heure || '', recuperation_date: isoDe(ajouterJours(S.pr.date_evenement, 1)) });
      ['livraison_date', 'livraison_heure', 'recuperation_date'].forEach((k) => { const i = $('#pr-' + k); if (i) i.value = S.pr[k]; });
      majPrestationLive(true);
      toast('Livraison et récupération recalculées');
      break;
    }
    case 'pr-role': S.pr[el.dataset.role] = S.pr[el.dataset.role] === el.dataset.id ? '' : el.dataset.id; majPrestationLive(true); break;
    case 'pr-enregistrer': await enregistrerPrestation(); break;
    case 'pr-statut': await changerStatutPrestation(el.dataset.statut); break;
    case 'pr-supprimer': await supprimerPrestation(); break;
    case 'pr-agenda':
      if (prestationModifiee() && !(await enregistrerPrestation())) break;
      modaleAgenda(S.prOrig);
      break;
    case 'agenda-ics': telechargerIcs(S.agenda.evts, S.agenda.nom); fermerModale(); toast('Fichier agenda téléchargé'); break;
    case 'dv-creer-prestation': {
      try { const r = await assurerPrestationDevis(S.dvOrig); await chargerDonnees(); renderVue(); toast(r.cree ? 'Prestation créée au planning' : 'Prestation remise au planning'); }
      catch (err) { toast(messageErreur(err), 'erreur'); }
      break;
    }

    /* --- Paramètres du lot 2 --- */
    case 'cat-nouveau':
      S.brouillon.catalogue.push({ categorie: 'Option', libelle: '', description: '', prix: '', unite: 'forfait' });
      renderVue();
      setTimeout(() => { const ins = $$('[data-cat$=".libelle"]'); ins[ins.length - 1]?.focus(); }, 30);
      break;
    case 'cat-suppr': S.brouillon.catalogue.splice(Number(el.dataset.i), 1); renderVue(); break;
    case 'logo-retirer': S.brouillon.entreprise.logo = ''; renderVue(); break;
    case 'modele-renommer': {
      const m = S.modeles.find((x) => x.id === el.dataset.id);
      if (!m) break;
      ouvrirModale(`<h2>Renommer le modèle</h2>
        <div class="champ"><label for="mod-renom">Nom</label><input id="mod-renom" value="${esc(m.nom)}"></div>
        <div class="modale-actions"><button class="btn" data-r="0">Annuler</button><button class="btn btn-flash" data-action="modele-renommer-ok" data-id="${esc(m.id)}">Renommer</button></div>`);
      break;
    }
    case 'modele-renommer-ok': {
      const nom = $('#mod-renom')?.value.trim();
      if (!nom) { $('#mod-renom')?.focus(); break; }
      fermerModale();
      try { await DB.majModele(el.dataset.id, { nom }); await chargerDonnees(); renderVue(); toast('Modèle renommé'); }
      catch (err) { toast(messageErreur(err), 'erreur'); }
      break;
    }
    case 'modele-suppr': {
      const m = S.modeles.find((x) => x.id === el.dataset.id);
      if (!m || !(await confirmer({ titre: 'Supprimer ce modèle ?', texte: `Le modèle « ${m.nom} » sera supprimé. Les devis déjà faits ne changent pas.`, ok: 'Supprimer', danger: true }))) break;
      try { await DB.supprimerModele(m.id); await chargerDonnees(); renderVue(); toast('Modèle supprimé'); }
      catch (err) { toast(messageErreur(err), 'erreur'); }
      break;
    }
  }
});

function ajouterPuce(liste) {
  const input = $('#ajout-' + liste);
  const val = input?.value.trim();
  if (!val) { input?.focus(); return; }
  if (S.brouillon[liste].some((x) => sansAccent(x) === sansAccent(val))) { toast('Ce choix existe déjà.', 'erreur'); return; }
  S.brouillon[liste].push(val);
  renderVue();
  setTimeout(() => $('#ajout-' + liste)?.focus(), 20);
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.f && S.fiche) { S.fiche[t.dataset.f] = t.value; majFicheAlertes(); return; }
  if (t.id === 'recherche-clients') { S.recherche = t.value; renderListeClients(); return; }
  if (t.id === 'recherche-journal') { S.jFiltre.q = t.value; $('#liste-journal').innerHTML = listeJournal(); return; }
  if (t.id === 'recherche-fa') { S.faRecherche = t.value; renderListeFactures(); return; }
  if (t.dataset.fa && S.fa) { S.fa[t.dataset.fa] = t.value; majFactureLive(); return; }
  if (t.dataset.fl && S.fa) { const [i, k] = t.dataset.fl.split('.'); S.fa.lignes[Number(i)][k] = t.value; majFactureLive(); return; }
  if (t.dataset.pa && S.paEdit) { S.paEdit[t.dataset.pa] = t.value; return; }
  if (t.dataset.fm && S.fmEdit) { S.fmEdit[t.dataset.fm] = t.value; return; }
  if (t.dataset.me && S.mtEdit) { S.mtEdit[t.dataset.me] = t.value; return; }
  if (t.dataset.ml && S.mtEdit) {
    const [i, champ] = t.dataset.ml.split('.');
    const l = S.mtEdit.lignes[Number(i)];
    if (champ === 'choix') {
      if (t.value.startsWith('c:')) { l.type = 'consommable'; l.consommable_id = t.value.slice(2); l.libelle = S.consommables.find((c) => c.id === l.consommable_id)?.nom || ''; if (!v(l.prix_unitaire) || num(l.prix_unitaire) === 0) l.prix_unitaire = fmtNombre(S.consommables.find((c) => c.id === l.consommable_id)?.prix_unitaire || 0); }
      else { l.type = t.value; l.consommable_id = null; }
      rafraichirMt();
    } else {
      l[champ] = t.value;
      const tot = S.mtEdit.lignes.reduce((s, x) => s + cts(num(x.quantite) * num(x.prix_unitaire)), 0);
      const el = $('#cmd-total'); if (el) el.textContent = eur(tot);
    }
    return;
  }
  if (t.dataset.pr && S.pr) {
    S.pr[t.dataset.pr] = t.value;
    majPrestationLive(/date|heure/.test(t.dataset.pr));
    return;
  }
  if (t.dataset.ind && S.indispoEdit) { S.indispoEdit[t.dataset.ind] = t.value; return; }
  if (t.dataset.dv && S.dv) { S.dv[t.dataset.dv] = t.value; majDevisLive(); return; }
  if (t.dataset.l && S.dv) {
    const [i, k] = t.dataset.l.split('.');
    S.dv.lignes[Number(i)][k] = t.value;
    if (t.tagName === 'TEXTAREA') autoGrow(t);
    majDevisLive();
    return;
  }
  if (t.id === 'recherche-devis') { S.dRecherche = t.value; renderListeDevis(); return; }
  if (t.id === 'pick-q') { $('#pick-liste').innerHTML = listePick(t.value); return; }
  if (t.dataset.p) {
    const [s, k, sous] = t.dataset.p.split('.');   // ex. repartition.primes.presence
    if (sous) S.brouillon[s][k][sous] = t.value; else S.brouillon[s][k] = t.value;
    majPied(s);
    if (s === 'devis') { const ap = $('#apercu-numero'); if (ap) ap.innerHTML = apercuNumeroHtml(); }
    return;
  }
  if (t.dataset.cat) { const [i, k] = t.dataset.cat.split('.'); S.brouillon.catalogue[Number(i)][k] = t.value; majPied('catalogue'); return; }
  if (t.dataset.a) {
    const [i, k] = t.dataset.a.split('.');
    S.brouillon.associes[Number(i)][k] = t.value;
    if (k === 'prenom' || k === 'nom') {
      const ini = $(`[data-a="${i}.initiales"]`);
      if (ini) ini.placeholder = initialesAuto(S.brouillon.associes[Number(i)]);
    }
    majPied('associes');
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'tri-clients') { S.tri = t.value; renderListeClients(); }
  if (t.id === 'module-journal') { S.jFiltre.module = t.value; $('#liste-journal').innerHTML = listeJournal(); }
  if (t.id === 'me-auto' && S.mtEdit) { S.mtEdit.decompte_auto = t.checked; return; }
  if (t.id === 'me-actif' && S.mtEdit) { S.mtEdit.actif = !t.checked; return; }
  if (t.id === 'ind-journee' && S.indispoEdit) {
    Object.assign(S.indispoEdit, t.checked ? { heure_debut: '', heure_fin: '' } : { heure_debut: '09:00', heure_fin: '18:00' });
    rafraichirIndispo();
  }
  if (t.id === 'logo-fichier' && t.files?.[0]) {
    lireLogo(t.files[0])
      .then((url) => { S.brouillon.entreprise.logo = url; renderVue(); toast('Logo prêt : pense à enregistrer'); })
      .catch((err) => toast(messageErreur(err), 'erreur'));
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'form-connexion') seConnecter(e);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('#modale').innerHTML) { const f = $('.modale-fond'); if (f?.dataset.fermable === '1') fermerModale(false); return; }
    if (S.fiche) fermerFiche();
  }
  if (e.key === 'Enter' && e.target.dataset?.ajout) { e.preventDefault(); ajouterPuce(e.target.dataset.ajout); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.fa && !S.fiche) { e.preventDefault(); enregistrerFacture(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.pr && !S.fiche) { e.preventDefault(); enregistrerPrestation(); return; }
  if (e.key === 'Enter' && e.target.dataset?.action === 'pl-jour') { e.preventDefault(); e.target.click(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.dv && !S.fiche) { e.preventDefault(); enregistrerDevis(); return; }
  if (e.key === 'Enter' && e.target.id === 'mod-nom') { e.preventDefault(); validerModele(); return; }
  if (e.key === 'Enter' && e.target.id === 'mod-renom') { e.preventDefault(); $('#modale [data-action="modele-renommer-ok"]')?.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'id-prenom') { e.preventDefault(); e.target.closest('.modale').querySelector('[data-action="creer-ma-fiche"]').click(); }
});

document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (!S.renduDiffere) return;
    const actif = document.activeElement;
    if (!(actif && $('#vue')?.contains(actif) && /INPUT|TEXTAREA|SELECT/.test(actif.tagName))) renderVue();
  }, 120);
});

window.addEventListener('hashchange', surHash);

function etatReseau() {
  $('#reseau').innerHTML = navigator.onLine ? '' : '<div class="hors-ligne">Hors connexion : les modifications ne seront pas enregistrées.</div>';
}
window.addEventListener('online', () => { etatReseau(); if (S.user && MODE === 'supabase') recharger(); });
window.addEventListener('offline', etatReseau);

/* =====================================================================
   Démarrage
   ===================================================================== */
async function demarrer() {
  etatReseau();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* pas bloquant */ });
  }
  if (MODE === 'supabase') {
    if (!window.supabase) {
      $('#app').innerHTML = '<div class="connexion-zone" style="min-height:100vh"><div class="connexion-form"><h1>Connexion impossible</h1><div class="erreur-form">La bibliothèque de connexion n’a pas pu être chargée. Vérifie ta connexion internet puis recharge la page.</div></div></div>';
      return;
    }
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
    sb.auth.onAuthStateChange((evenement) => {
      if (evenement === 'PASSWORD_RECOVERY') setTimeout(demanderNouveauMdp, 600);
      if (evenement === 'SIGNED_OUT' && S.user) setTimeout(() => { S.user = null; renderConnexion(); }, 0);
    });
    const { data } = await sb.auth.getSession();
    if (data.session) await apresConnexion(data.session.user.email);
    else renderConnexion();
  } else {
    const email = stockage.lire('flashbox_demo_session');
    Demo.charger();
    if (email && Demo.data.associes.some((a) => a.email === email)) await apresConnexion(email);
    else renderConnexion();
  }
}
demarrer();
</script>
</body>
</html>
